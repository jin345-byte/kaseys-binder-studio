name: Broad Artwork Preview Check

on:
  push:
    branches: [prod-db-compat-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-broad-art-preview
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify character-first artwork search
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path){const r=await fetch(BASE+path+(path.includes('?')?'&':'?')+'qa='+Date.now(),{cache:'no-store'});return {r,p:await r.json()}}
          (async()=>{
            let frieren;
            for(let i=0;i<12;i++){
              frieren=await get('/api/art-feed-v3?tag=frieren&pid=0').catch(()=>null);
              const active=frieren?.r?.headers.get('x-kbs-character-search')==='1';
              console.log('CHARACTER_SEARCH_ATTEMPT',JSON.stringify({attempt:i+1,status:frieren?.r?.status||0,active,results:frieren?.p?.results?.length||0,zerochan:frieren?.p?.sourceCounts?.zerochan||0,plan:frieren?.p?.queryPlan||[]}));
              if(frieren?.r?.ok&&active&&frieren?.p?.zerochanConfigured===true)break;
              await sleep(5000);
            }
            if(!frieren?.r?.ok||frieren.r.headers.get('x-kbs-character-search')!=='1')throw new Error('Character search v3 not active');
            if(frieren.p.zerochanConfigured!==true)throw new Error('Zerochan is not configured');
            if(Number(frieren.p?.sourceCounts?.zerochan||0)<1)throw new Error('Zerochan returned no Frieren results: '+JSON.stringify(frieren.p.sourceCounts));
            if(!Array.isArray(frieren.p.results)||frieren.p.results.length<10)throw new Error('Frieren returned too few results');

            const cynthia=await get('/api/art-feed-v3?tag='+encodeURIComponent('Cynthia Pokémon Champion')+'&pid=0');
            if(!cynthia.r.ok||cynthia.r.headers.get('x-kbs-character-search')!=='1')throw new Error('Cynthia character search failed');
            const cplan=cynthia.p.queryPlan||[];
            if(!cplan.includes('shirona_(pokemon)')||!cplan.some(x=>x.toLowerCase()==='cynthia (pokemon)'))throw new Error('Pokemon Trainer/Champion expansion missing: '+JSON.stringify(cplan));
            if(!Array.isArray(cynthia.p.results)||cynthia.p.results.length<5)throw new Error('Cynthia search returned too few results: '+(cynthia.p.results?.length||0));

            const raven=await get('/api/art-feed-v3?tag='+encodeURIComponent('Raven from Teen Titans')+'&pid=0');
            if(!raven.r.ok||!(raven.p.queryPlan||[]).some(x=>x.toLowerCase()==='raven (teen titans)'))throw new Error('Generic character-from-series expansion missing: '+JSON.stringify(raven.p.queryPlan||[]));

            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(BASE+'/?charactersearch='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.click('#libraryArtworkTab');
            await page.fill('#artSearchQuery','Cynthia Pokémon Champion');
            await page.click('#artSearchSubmit');
            await page.waitForFunction(()=>Number(document.querySelector('#autoArtworkCount')?.textContent||0)>=5,{timeout:45000});
            const ui=await page.evaluate(()=>({count:Number(document.querySelector('#autoArtworkCount')?.textContent||0),status:document.querySelector('#autoArtworkStatus')?.textContent||'',cards:document.querySelectorAll('#autoArtworkResults .auto-art-card').length,zerochanLink:document.querySelector('#artSourceZerochan')?.href||''}));
            if(ui.count<5||ui.cards<5)throw new Error('Cynthia UI search returned too few results: '+JSON.stringify(ui));
            if(!ui.zerochanLink.toLowerCase().includes('cynthia'))throw new Error('Zerochan source link did not follow character search');
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            await browser.close();
            console.log('CHARACTER_SEARCH_PASS',JSON.stringify({frieren:{results:frieren.p.results.length,sources:frieren.p.sourceCounts},cynthia:{results:cynthia.p.results.length,plan:cplan},ravenPlan:raven.p.queryPlan,ui}));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
