name: Binder Cover Preview Check

on:
  push:
    branches: [prod-db-compat-preview]
    paths:
      - 'public/features/binder-cover-designer.js'
      - 'public/styles/binder-cover-designer.css'
      - 'public/features/staging-v287.js'
      - '.github/workflows/binder-cover-preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-cover-preview
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static cover checks
        run: |
          node --check public/features/binder-cover-designer.js
          grep -q 'binder-cover-designer.css?v=3.1.1' public/features/staging-v287.js
          grep -q 'binder-cover-designer.js?v=3.1.1' public/features/staging-v287.js
          grep -q 'KBSBinderCovers' public/features/binder-cover-designer.js
          grep -q 'binder-shelf' public/styles/binder-cover-designer.css
          grep -q 'MutationObserver' public/features/binder-cover-designer.js
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify deployed binder cover designer
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let live=false;
            for(let i=0;i<30;i++){
              const [r,l]=await Promise.all([
                fetch(BASE+'/features/binder-cover-designer.js?qa='+Date.now(),{cache:'no-store'}).catch(()=>null),
                fetch(BASE+'/features/staging-v287.js?qa='+Date.now(),{cache:'no-store'}).catch(()=>null)
              ]);
              const t=r?.ok?await r.text().catch(()=>''):'';
              const lt=l?.ok?await l.text().catch(()=>''):'';
              if(t.includes('KBSBinderCovers')&&t.includes('MutationObserver')&&lt.includes('binder-cover-designer.js?v=3.1.1')){live=true;break;}
              await sleep(6000);
            }
            if(!live)throw new Error('Binder cover v3.1.1 assets did not propagate');

            const manifestResp=await fetch(BASE+'/catalog/manifest.json?coverqa='+Date.now(),{cache:'no-store'});
            if(!manifestResp.ok)throw new Error('Could not read deployed catalog manifest');
            const manifest=await manifestResp.json();

            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(BASE+'/?coverqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(v=>localStorage.getItem('kbsPrebuiltCatalogVersion')===v,manifest.version,{timeout:120000});
            await page.waitForTimeout(2500);
            await page.waitForSelector('#openBinders',{timeout:30000});
            await page.click('#openBinders');
            await page.waitForSelector('#binderModal.open',{timeout:10000});
            await page.waitForSelector('#designBinderCover',{state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.querySelectorAll('.binder-cover-card').length>0,{timeout:30000});
            await page.click('#designBinderCover');
            await page.waitForSelector('#binderCoverDesigner.open',{timeout:10000});
            await page.fill('#binderCoverTitle','Eeveelution Art Binder');
            await page.fill('#binderCoverSubtitle','Illustration rares + matching artwork');
            await page.fill('#binderCoverSpine','EEVEELUTIONS');
            await page.fill('#binderCoverCharacter','Sylveon');
            await page.selectOption('#binderCoverIcon','♥');
            await page.$eval('#binderCoverColor',el=>{el.value='#7a4967';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.click('#binderCoverSave');
            await page.waitForFunction(()=>!document.querySelector('#binderCoverDesigner')?.classList.contains('open'));
            await page.waitForFunction(()=>document.querySelector('.binder-cover-card .binder-cover-footer strong')?.textContent?.includes('Eeveelution Art Binder'));
            const saved=await page.evaluate(async()=>{const b=await dbGet('binders',activeBinderId);return{name:b?.name,cover:b?.cover,shelf:document.querySelector('#binderList')?.classList.contains('binder-shelf'),cards:document.querySelectorAll('.binder-cover-card').length}});
            if(saved.name!=='Eeveelution Art Binder')throw new Error('Binder title was not saved');
            if(saved.cover?.subtitle!=='Illustration rares + matching artwork'||saved.cover?.spineText!=='EEVEELUTIONS'||saved.cover?.character!=='Sylveon'||saved.cover?.icon!=='♥'||saved.cover?.color!=='#7a4967')throw new Error('Cover metadata mismatch '+JSON.stringify(saved));
            if(!saved.shelf||saved.cards<1)throw new Error('Binder shelf did not render');
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1500);
            await page.click('#openBinders');
            await page.waitForFunction(()=>document.querySelectorAll('.binder-cover-card').length>0,{timeout:30000});
            const persisted=await page.$eval('.binder-cover-card .binder-cover-footer strong',el=>el.textContent);
            if(!persisted.includes('Eeveelution Art Binder'))throw new Error('Cover did not persist after reload');
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            await browser.close();
            console.log('BINDER_COVER_PASS',JSON.stringify({saved,persisted,catalogVersion:manifest.version}));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
