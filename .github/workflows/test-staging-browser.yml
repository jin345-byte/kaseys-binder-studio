name: Test Staging Browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Exercise staging in Chromium
        shell: bash
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const STAGING='https://kaseys-binder-studio-staging.jin345.workers.dev';
          const RAW='https://raw.githubusercontent.com/PokemonTCG/pokemon-tcg-data/master/sets/en.json';
          const FAN='https://safebooru.donmai.us/posts.json?limit=20&page=1&tags=eevee%20rating%3Ag';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext();
            const page=await ctx.newPage();
            const interesting=[];
            const errors=[];
            const failed=[];
            page.on('console',m=>{ if(m.type()==='error') errors.push('CONSOLE '+m.text()); });
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('requestfailed',r=>failed.push({url:r.url(),failure:r.failure()}));
            page.on('response',async r=>{
              const u=r.url();
              if(/raw\.githubusercontent\.com|pokeapi\.co|donmai\.us|safebooru\.org/.test(u)){
                let prefix='';
                try{prefix=(await r.text()).slice(0,180).replace(/\s+/g,' ');}catch{}
                interesting.push({url:u,status:r.status(),ct:r.headers()['content-type']||'',prefix});
              }
            });

            let fatal='';
            try{
              await page.goto(STAGING,{waitUntil:'networkidle',timeout:60000});
              const sw=await page.evaluate(async()=>{
                const reg=await navigator.serviceWorker.getRegistration();
                return {
                  controlled:!!navigator.serviceWorker.controller,
                  controller:navigator.serviceWorker.controller?.scriptURL||null,
                  active:reg?.active?.scriptURL||null,
                  waiting:reg?.waiting?.scriptURL||null
                };
              });
              console.log('SERVICE_WORKER',JSON.stringify(sw));

              const direct=await page.evaluate(async({raw,fan})=>{
                async function probe(url){
                  try{
                    const r=await fetch(url,{headers:{Accept:'application/json'},cache:'no-store'});
                    const text=await r.text();
                    let jsonOk=false,shape='';
                    try{
                      const j=JSON.parse(text);jsonOk=true;shape=Array.isArray(j)?`array:${j.length}`:typeof j;
                    }catch{}
                    return {ok:r.ok,status:r.status,ct:r.headers.get('content-type')||'',acao:r.headers.get('access-control-allow-origin')||'',jsonOk,shape,prefix:text.slice(0,180).replace(/\s+/g,' ')};
                  }catch(e){return {error:String(e?.message||e)};}
                }
                return {raw:await probe(raw),fan:await probe(fan)};
              },{raw:RAW,fan:FAN});
              console.log('DIRECT_FETCH',JSON.stringify(direct,null,2));

              await page.fill('#subject','eevee');
              await page.click('#searchBtn');
              await page.waitForTimeout(5000);
              const art=await page.evaluate(()=>({
                count:document.querySelector('#autoArtworkCount')?.textContent,
                status:document.querySelector('#autoArtworkStatus')?.textContent,
                cards:[...document.querySelectorAll('#autoArtworkResults .auto-art-card')].length,
                html:document.querySelector('#autoArtworkResults')?.innerHTML?.slice(0,300)
              }));
              console.log('ARTWORK_UI',JSON.stringify(art));

              // DOM click bypasses animation/stability heuristics.
              await page.evaluate(()=>document.querySelector('#syncMasterLibrary')?.click());
              await page.waitForTimeout(10000);
              const lib=await page.evaluate(()=>({
                error:document.querySelector('#runtimeErrorText')?.textContent||'',
                status:document.querySelector('#masterLibraryStatus')?.textContent||'',
                progress:document.querySelector('#libraryProgressText')?.textContent||''
              }));
              console.log('LIBRARY_UI',JSON.stringify(lib));

              if(direct.raw?.jsonOk!==true) throw new Error('Direct raw GitHub fetch is not valid JSON: '+JSON.stringify(direct.raw));
              if(direct.fan?.jsonOk!==true) throw new Error('Direct fan-art fetch is not valid JSON: '+JSON.stringify(direct.fan));
              if(lib.error) throw new Error('Library UI error: '+lib.error);
              if(Number(art.cards)<5) throw new Error('Artwork UI returned fewer than 5 cards: '+JSON.stringify(art));
            }catch(e){fatal=String(e?.stack||e);}
            finally{
              console.log('NETWORK',JSON.stringify(interesting,null,2));
              console.log('REQUEST_FAILED',JSON.stringify(failed,null,2));
              console.log('ERRORS',JSON.stringify(errors,null,2));
              await browser.close();
            }
            if(fatal)throw new Error(fatal);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
