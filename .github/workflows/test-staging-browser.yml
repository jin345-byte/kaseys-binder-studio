name: Test Staging Browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Exercise staging artwork images and library in Chromium
        shell: bash
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const STAGING='https://kaseys-binder-studio-staging.jin345.workers.dev';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext();
            const page=await ctx.newPage();
            const errors=[];
            const failed=[];
            const responses=[];
            page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));
            page.on('response',r=>{
              const u=r.url();
              if(/raw\.githubusercontent\.com|donmai\.us|art-cache|pokemontcg\.io|tcgdex/.test(u)){
                responses.push({url:u,status:r.status(),ct:r.headers()['content-type']||''});
              }
            });

            let fatal='';
            try{
              await page.goto(STAGING,{waitUntil:'networkidle',timeout:60000});
              await page.fill('#subject','eevee');
              await page.click('#searchBtn');
              await page.waitForTimeout(6000);

              const art=await page.evaluate(()=>{
                const imgs=[...document.querySelectorAll('#autoArtworkResults img')];
                return {
                  cards:document.querySelectorAll('#autoArtworkResults .auto-art-card').length,
                  status:document.querySelector('#autoArtworkStatus')?.textContent||'',
                  images:imgs.map((img,i)=>({i,src:img.currentSrc||img.src,complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight})),
                  loaded:imgs.filter(img=>img.complete&&img.naturalWidth>0).length,
                  broken:imgs.filter(img=>img.complete&&img.naturalWidth===0).length
                };
              });
              console.log('ARTWORK_DIAG',JSON.stringify(art,null,2));

              // Start the full library and watch long enough to catch intermittent set failures.
              await page.evaluate(()=>document.querySelector('#syncMasterLibrary')?.click());
              for(let i=0;i<12;i++){
                await page.waitForTimeout(5000);
                const state=await page.evaluate(()=>({
                  error:document.querySelector('#runtimeErrorText')?.textContent||'',
                  status:document.querySelector('#masterLibraryStatus')?.textContent||'',
                  progress:document.querySelector('#libraryProgressText')?.textContent||''
                }));
                console.log('LIBRARY_TICK',i+1,JSON.stringify(state));
                if(state.error) break;
                if(/ready|complete|synced/i.test(state.status)) break;
              }

              const lib=await page.evaluate(()=>({
                error:document.querySelector('#runtimeErrorText')?.textContent||'',
                status:document.querySelector('#masterLibraryStatus')?.textContent||'',
                progress:document.querySelector('#libraryProgressText')?.textContent||''
              }));
              console.log('LIBRARY_FINAL',JSON.stringify(lib,null,2));

              const relevantFailed=failed.filter(x=>/raw\.githubusercontent\.com|donmai\.us|art-cache|pokemontcg\.io|tcgdex/.test(x.url));
              console.log('RELEVANT_RESPONSES',JSON.stringify(responses,null,2));
              console.log('RELEVANT_FAILED',JSON.stringify(relevantFailed,null,2));
              console.log('CONSOLE_ERRORS',JSON.stringify(errors,null,2));

              if(art.cards<10) throw new Error('Expected at least 10 artwork cards, got '+art.cards);
              if(art.loaded<10) throw new Error('Artwork cards exist but images failed to render: loaded='+art.loaded+' broken='+art.broken);
              if(lib.error) throw new Error('Library UI error: '+lib.error);
            }catch(e){fatal=String(e?.stack||e);}
            await browser.close();
            if(fatal) throw new Error(fatal);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
