name: Layout Overlap Check

on:
  push:
    branches: [prod-db-compat-preview]
    paths:
      - 'public/**'
      - '.github/workflows/layout-overlap-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-layout-overlap-check
  cancel-in-progress: true

jobs:
  overlap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify overlap styles are wired
        run: |
          grep -q "layout-overlap-fixes.css?v=4.0.3.1" public/features/staging-v287.js
          grep -q "ui-flow-polish.css?v=4.0.5" public/features/staging-v287.js
          grep -q "binder-cover-footer" public/styles/layout-overlap-fixes.css
          grep -q "card-detail-row" public/styles/layout-overlap-fixes.css
          ! grep -q 'repeat(4,minmax(0,1fr))' public/styles/responsive-button-fit.css
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Check card, binder and button geometry
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function waitLive(){for(let i=0;i<60;i++){const r=await fetch(BASE+'/features/staging-v287.js?overlap='+Date.now(),{cache:'no-store'}).catch(()=>null),t=r?.ok?await r.text():'';if(t.includes('v4.0.5 preview')&&t.includes('ui-flow-polish.css?v=4.0.5'))return;await sleep(5000)}throw new Error('v4.0.5 overlap assets did not propagate')}
          (async()=>{
            await waitLive();const browser=await chromium.launch({headless:true});const failures=[];
            const themes=['jolteon','pokedex','game-boy','neo-genesis','team-rocket','lavender','cyberpunk','cozy-sakura','dark-academia','e-ink','retro-card-shop'];
            const fonts=['system','verdana','trebuchet','georgia'];
            for(const vp of [{name:'desktop',width:1440,height:1000},{name:'narrow',width:900,height:900},{name:'mobile',width:390,height:844}]){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});const page=await context.newPage();
              await page.goto(BASE+'/?focus=3.3.2&build=4.0.5&overlap='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>document.querySelector('#kbsLayoutOverlapFixesStyle')&&document.querySelector('#kbsUiFlowPolishStyle')&&globalThis.KBSFullThemes?.list?.().length===11&&globalThis.KBSTypography,{timeout:60000});
              await page.evaluate(()=>{document.querySelector('#cards').innerHTML=`<article class="item card-item" draggable="true" data-kind="card" data-id="qa-card"><button class="pick" data-kind="card"><span class="card-image-wrap"><img alt="QA"></span><span class="item-copy"><strong>Pikachu ex Extremely Long Readability Test</strong><span class="card-detail-row"><small class="card-number">#094</small><small class="card-artist">Very Long Artist Name For Overflow Testing</small></span></span></button></article>`});
              if(vp.name==='mobile')await page.evaluate(()=>document.querySelector('[data-mobile-lab="cards"]')?.click());
              const checkCard=async label=>{const x=await page.evaluate(()=>{const root=document.querySelector('#cards .card-item'),copy=root?.querySelector('.item-copy'),detail=root?.querySelector('.card-detail-row'),num=root?.querySelector('.card-number'),artist=root?.querySelector('.card-artist');if(!root||!copy||!detail||!num||!artist)return null;const rr=root.getBoundingClientRect(),cr=copy.getBoundingClientRect(),dr=detail.getBoundingClientRect(),nr=num.getBoundingClientRect(),ar=artist.getBoundingClientRect();return{rr,cr,dr,nr,ar,rootScroll:root.scrollHeight,rootClient:root.clientHeight,copyScroll:copy.scrollHeight,copyClient:copy.clientHeight}});if(!x){failures.push(`${vp.name}/${label}: missing QA card`);return}if([x.cr,x.dr,x.nr,x.ar].some(r=>r.bottom>x.rr.bottom+1||r.left<x.rr.left-1||r.right>x.rr.right+1))failures.push(`${vp.name}/${label}: card metadata clips`);if(x.rootScroll>x.rootClient+1||x.copyScroll>x.copyClient+1)failures.push(`${vp.name}/${label}: card hidden overflow`)};
              for(const theme of themes){await page.evaluate(t=>KBSFullThemes.apply(t,{persist:false,applyPalette:false}),theme);await checkCard(theme)}
              await page.evaluate(()=>KBSFullThemes.apply('lavender',{persist:false,applyPalette:false}));for(const font of fonts){await page.selectOption('#kbsFontSelect',font);await checkCard('font-'+font)}

              if(vp.name==='desktop')await page.locator('#openBinders:visible').click();else await page.evaluate(()=>document.querySelector('#mobilePageBinders')?.click()||document.querySelector('#openBinders')?.click());
              await page.waitForSelector('#binderModal.open',{timeout:15000});await page.waitForFunction(()=>!!document.querySelector('#kbsBinderCoverDesignerScript'),{timeout:15000});
              await page.evaluate(()=>{
                const list=document.querySelector('#binderList'),pages=document.querySelector('#pageBrowser');
                list.innerHTML=`<button class="binder-chip binder-cover-card active" data-binder="qa"><span class="binder-cover-face"><span class="binder-cover-spine">LONG TEST BINDER TITLE</span><span class="binder-cover-art"><span class="binder-cover-icon">✦</span><span class="binder-cover-copy"><small>Very Long Character Label</small><strong>New Binder With A Much Longer Readability Name</strong><em>Long subtitle for overlap testing</em></span></span></span><span class="binder-cover-footer"><strong>New Binder With A Much Longer Readability Name</strong><small>4 pages</small></span></button>`;
                pages.innerHTML=`<article class="page-card"><div class="page-card-meta"><strong class="page-card-title">A Very Long Page Title That Must Wrap Without Hitting The Buttons</strong><small class="page-card-count">Page 1</small></div><div class="page-card-actions"><button>View</button><button>Edit</button><button class="duplicate-page">Copy</button><button class="danger">Delete</button></div></article>`;
              });
              const checkBinder=async label=>{const g=await page.evaluate(()=>{const card=document.querySelector('#binderList .binder-cover-card'),face=card?.querySelector('.binder-cover-face'),footer=card?.querySelector('.binder-cover-footer'),pageCard=document.querySelector('#pageBrowser .page-card'),title=pageCard?.querySelector('.page-card-title'),actions=pageCard?.querySelector('.page-card-actions');if(!card||!face||!footer||!pageCard||!title||!actions)return null;const c=card.getBoundingClientRect(),f=face.getBoundingClientRect(),ft=footer.getBoundingClientRect(),p=pageCard.getBoundingClientRect(),tr=title.getBoundingClientRect(),ar=actions.getBoundingClientRect();return{c,f,ft,p,tr,ar,cardScroll:card.scrollHeight,cardClient:card.clientHeight,pageScroll:pageCard.scrollHeight,pageClient:pageCard.clientHeight}});if(!g){failures.push(`${vp.name}/${label}: QA binder/page missing`);return}if(g.ft.top<g.f.bottom-1)failures.push(`${vp.name}/${label}: binder footer overlaps cover by ${(g.f.bottom-g.ft.top).toFixed(1)}px`);if(g.ft.bottom>g.c.bottom+1||g.cardScroll>g.cardClient+1)failures.push(`${vp.name}/${label}: binder footer/card clips`);if(g.ar.top<g.tr.bottom-1||g.ar.bottom>g.p.bottom+1||g.pageScroll>g.pageClient+1)failures.push(`${vp.name}/${label}: page title/actions overlap or clip`)};
              for(const theme of themes){await page.evaluate(t=>KBSFullThemes.apply(t,{persist:false,applyPalette:false}),theme);await checkBinder(theme)}
              await page.evaluate(()=>KBSFullThemes.apply('lavender',{persist:false,applyPalette:false}));for(const font of fonts){await page.selectOption('#kbsFontSelect',font);await checkBinder('font-'+font)}
              await context.close();
            }
            await browser.close();if(failures.length)throw new Error(failures.join('\n'));console.log('LAYOUT_OVERLAP_CHECK_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
