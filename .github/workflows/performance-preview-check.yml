name: Performance Preview Check

on:
  push:
    branches: [prod-db-compat-preview]
    paths:
      - 'public/**'
      - '.github/workflows/performance-preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-performance-preview
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static performance layer checks
        run: |
          set -euo pipefail
          node --check public/features/performance-core.js
          node --check public/features/staging-v287.js
          grep -q 'features/performance-core.js?v=4.0.3' public/index.html
          grep -q "PERF_VERSION='4.0.3'" public/features/performance-core.js
          grep -q "ensureGame('union-arena')" public/features/performance-core.js
          grep -q 'virtualLimit=60' public/features/performance-core.js
          grep -q 'optimizeImageFile' public/features/performance-core.js
          grep -q 'thumbnailBytes' public/features/performance-core.js
          grep -q 'lazyRegistry.delete(src)' public/features/performance-core.js
          grep -q 'Binder Studio v4.0.4 preview' public/features/staging-v287.js
          grep -q 'v4.0.4 STAGING' public/index.html
          grep -q '4.0.4-staging-preview' public/index.html
          grep -q "defaultTheme:'lavender'" public/features/staging-v287.js
          test ! -e public/styles/theme-animated-accents.css
          ! grep -R -q 'theme-animated-accents.js' public
          echo PERFORMANCE_STATIC_PASS
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser performance smoke test
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let live=false;for(let i=0;i<60;i++){const s=Date.now();const [a,b,c]=await Promise.all([fetch(BASE+'/features/performance-core.js?perf='+s,{cache:'no-store'}).catch(()=>null),fetch(BASE+'/features/staging-v287.js?perf='+s,{cache:'no-store'}).catch(()=>null),fetch(BASE+'/?perfassets='+s,{cache:'no-store'}).catch(()=>null)]);const [x,y,z]=await Promise.all([a?.ok?a.text():'',b?.ok?b.text():'',c?.ok?c.text():'']);if(x.includes("PERF_VERSION='4.0.3'")&&y.includes('Binder Studio v4.0.4 preview')&&z.includes('v4.0.4 STAGING')){live=true;break}await sleep(5000)}if(!live)throw new Error('Matching performance assets did not propagate');
            const browser=await chromium.launch({headless:true});
            for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
              const context=await browser.newContext({viewport});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await page.goto(BASE+'/?perfcheck='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});await page.waitForFunction(()=>globalThis.KBSModules?.version==='4.0.3'&&globalThis.KBSPreviewBuild?.version==='4.0.4'&&globalThis.KBSTypography,{timeout:30000});await page.waitForTimeout(500);
              const state=await page.evaluate(()=>({version:KBSModules.version,modules:Object.keys(KBSModules),virtualLimit:KBSModules.virtualization.limit,coverLoaded:!!document.querySelector('#kbsBinderCoverDesignerScript'),sourceLinksLoaded:!!document.querySelector('#kbsArtSourceLinksScript'),animatedStyle:!!document.querySelector('#kbsThemeAnimatedAccentsStyle'),animatedScript:!!document.querySelector('#kbsThemeAnimatedAccentsScript'),focusLoaded:!!document.querySelector('#kbsFocusPresentationScript'),topVersion:document.querySelector('#versionLink')?.textContent?.trim(),buildMeta:document.querySelector('meta[name="kbs-build"]')?.content,previewVersion:KBSPreviewBuild.version,motion:KBSPreviewBuild.motion,defaultTheme:KBSPreviewBuild.defaultTheme}));
              if(state.version!=='4.0.3'||state.previewVersion!=='4.0.4'||state.topVersion!=='v4.0.4 STAGING'||state.buildMeta!=='4.0.4-staging-preview'||state.motion!=='static'||state.defaultTheme!=='lavender')throw new Error('Version mismatch '+JSON.stringify(state));
              if(!['catalog','search','images','lazy'].every(k=>state.modules.includes(k))||state.virtualLimit!==60)throw new Error('Performance module mismatch '+JSON.stringify(state));
              if(state.coverLoaded||state.sourceLinksLoaded||state.animatedStyle||state.animatedScript||!state.focusLoaded)throw new Error('Lazy/runtime mismatch '+JSON.stringify(state));
              if(viewport.width>768){const b=page.locator('#openBinders:visible');if(!await b.count())throw new Error('Desktop My Binders hidden');await b.click()}else{if(!(await page.$('#mobilePageBinders')))throw new Error('Mobile My Binders control missing');await page.evaluate(()=>document.querySelector('#mobilePageBinders').click())}
              await page.waitForFunction(()=>!!document.querySelector('#kbsBinderCoverDesignerScript'),{timeout:15000});await page.locator('#closeBinders:visible').click().catch(()=>{});
              if(viewport.width>768)await page.locator('#libraryArtworkTab:visible').click();else await page.evaluate(()=>document.querySelector('[data-mobile-lab="art"]')?.click());
              await page.waitForFunction(()=>!!document.querySelector('#kbsArtSourceLinksScript'),{timeout:15000});
              const meaningful=errors.filter(x=>!x.includes('favicon'));if(meaningful.length)throw new Error('Browser errors: '+meaningful.join(' | '));
              console.log('PERFORMANCE_VIEWPORT_PASS',JSON.stringify({viewport,state}));await context.close();
            }
            await browser.close();console.log('PERFORMANCE_PREVIEW_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
