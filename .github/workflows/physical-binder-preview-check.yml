name: Physical Binder Preview Check

on:
  push:
    branches: [prod-db-compat-preview]
    paths:
      - 'public/features/physical-binder-preview.js'
      - 'public/styles/physical-binder-preview.css'
      - 'public/features/staging-v287.js'
      - '.github/workflows/physical-binder-preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-physical-preview
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static physical preview checks
        run: |
          node --check public/features/physical-binder-preview.js
          grep -q 'physical-binder-preview.css?v=3.2.1' public/features/staging-v287.js
          grep -q 'physical-binder-preview.js?v=3.2.1' public/features/staging-v287.js
          grep -q 'KBSPhysicalBinderPreview' public/features/physical-binder-preview.js
          grep -q 'restoreLibraryOnClose' public/features/physical-binder-preview.js
          grep -q 'prefers-reduced-motion' public/styles/physical-binder-preview.css
          grep -q 'physical-rings' public/styles/physical-binder-preview.css
          grep -q 'z-index:1400' public/styles/physical-binder-preview.css
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify deployed physical binder preview
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let live=false;
            for(let i=0;i<30;i++){
              const [r,l]=await Promise.all([
                fetch(BASE+'/features/physical-binder-preview.js?qa='+Date.now(),{cache:'no-store'}).catch(()=>null),
                fetch(BASE+'/features/staging-v287.js?qa='+Date.now(),{cache:'no-store'}).catch(()=>null)
              ]);
              const t=r?.ok?await r.text().catch(()=>''):'';
              const lt=l?.ok?await l.text().catch(()=>''):'';
              if(t.includes('restoreLibraryOnClose')&&t.includes('physical-preview-active')&&lt.includes('physical-binder-preview.js?v=3.2.1')){live=true;break;}
              await sleep(6000);
            }
            if(!live)throw new Error('Physical binder preview visibility fix did not propagate');

            const manifestResp=await fetch(BASE+'/catalog/manifest.json?qa='+Date.now(),{cache:'no-store'});
            if(!manifestResp.ok)throw new Error('Could not load catalog manifest');
            const manifest=await manifestResp.json();
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(BASE+'/?physicalqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(v=>localStorage.getItem('kbsPrebuiltCatalogVersion')===v,manifest.version,{timeout:120000});
            await page.waitForTimeout(2200);
            await page.waitForSelector('#openBinders',{timeout:30000});
            await page.click('#openBinders');
            await page.waitForSelector('#binderModal.open #physicalBinderPreview',{timeout:30000});
            await page.click('#physicalBinderPreview');
            await page.waitForSelector('#binderViewer.open .physical-closed-binder',{timeout:15000});
            const opened=await page.evaluate(()=>({
              viewerOpen:document.querySelector('#binderViewer')?.classList.contains('open'),
              viewerDisplay:getComputedStyle(document.querySelector('#binderViewer')).display,
              viewerVisibility:getComputedStyle(document.querySelector('#binderViewer')).visibility,
              viewerZ:getComputedStyle(document.querySelector('#binderViewer')).zIndex,
              libraryOpen:document.querySelector('#binderModal')?.classList.contains('open'),
              bodyLocked:document.body.classList.contains('physical-preview-open')
            }));
            if(!opened.viewerOpen||opened.viewerDisplay==='none'||opened.viewerVisibility==='hidden'||opened.libraryOpen||!opened.bodyLocked)throw new Error('Physical preview modal lifecycle mismatch '+JSON.stringify(opened));
            await page.waitForTimeout(3000);
            const stillOpen=await page.evaluate(()=>document.querySelector('#binderViewer')?.classList.contains('open')&&getComputedStyle(document.querySelector('#binderViewer')).display!=='none');
            if(!stillOpen)throw new Error('Physical preview disappeared after opening');

            const cover=await page.evaluate(()=>({counter:document.querySelector('#viewerCounter')?.textContent||'',title:document.querySelector('.physical-cover-copy strong')?.textContent||'',button:document.querySelector('#physicalBinderPreview')?.textContent||''}));
            if(cover.counter!=='Cover'||!cover.title||!cover.button.includes('Physical'))throw new Error('Cover view mismatch '+JSON.stringify(cover));
            await page.click('#viewerNext');
            await page.waitForSelector('#binderViewer.open .physical-spread',{timeout:15000});
            await page.waitForTimeout(1000);
            const spread=await page.evaluate(()=>({counter:document.querySelector('#viewerCounter')?.textContent||'',leaves:document.querySelectorAll('.physical-leaf').length,rings:document.querySelectorAll('.physical-rings i').length,glare:document.querySelectorAll('.physical-plastic-glare').length,open:document.querySelector('#binderViewer')?.classList.contains('open')}));
            if(!spread.open||spread.leaves!==2||spread.rings!==4||spread.glare<1||!spread.counter.toLowerCase().includes('page'))throw new Error('Spread view mismatch '+JSON.stringify(spread));
            await page.check('#physicalReducedMotion');
            const reduced=await page.$eval('#binderViewer',el=>el.classList.contains('physical-reduced-motion'));
            if(!reduced)throw new Error('Reduced motion toggle did not apply');
            await page.uncheck('#physicalRings');
            const noRings=await page.$eval('#binderViewer',el=>el.classList.contains('physical-no-rings'));
            if(!noRings)throw new Error('Ring toggle did not apply');

            await page.click('#closeViewer');
            await page.waitForSelector('#binderViewer:not(.open)',{timeout:10000});
            await page.waitForSelector('#binderModal.open',{timeout:10000});
            const returned=await page.evaluate(()=>({viewerOpen:document.querySelector('#binderViewer')?.classList.contains('open'),libraryOpen:document.querySelector('#binderModal')?.classList.contains('open'),bodyLocked:document.body.classList.contains('physical-preview-open')}));
            if(returned.viewerOpen||!returned.libraryOpen||returned.bodyLocked)throw new Error('Physical preview did not return cleanly to binder library '+JSON.stringify(returned));
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            await browser.close();
            console.log('PHYSICAL_BINDER_PREVIEW_PASS',JSON.stringify({opened,cover,spread,reduced,noRings,returned,catalogVersion:manifest.version}));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
