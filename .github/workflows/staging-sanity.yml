name: Staging v2.9 Phase 1-3 Sanity

on:
  push:
    branches: [staging-ui-auth-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-staging-sanity
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-ui-auth-test
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static architecture and syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in public/app.js public/features/cards-lab.js public/features/catalog-lab.js public/features/art-search-lab.js public/features/binder-lab.js public/features/mobile-lab.js public/features/cloud-sync.js public/features/data-safety.js public/features/prebuilt-catalog-bootstrap.js public/features/staging-fetch-shim.js public/features/staging-polish.js public/features/artwork-height-sync.js public/features/staging-v287.js public/features/help-lab.js public/features/guided-tour-auto-library.js public/features/guided-tour-finish.js public/features/guided-tour-step16-fix.js src/worker.js src/staging-worker.js; do node --check "$f"; done
          python - <<'PY'
          import re,pathlib
          html=pathlib.Path('public/index.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate source ids: {dup}'
          assert 'v2.9.0 STAGING' in html and 'serviceWorker.register' not in html
          required=['features/data-safety.js?v=2.9.0','features/prebuilt-catalog-bootstrap.js?v=2.9.0','features/artwork-height-sync.js?v=2.9.0','features/cloud-sync.js?v=2.9.0','features/guided-tour-finish.js?v=2.9.0','features/guided-tour-step16-fix.js?v=2.9.0']
          for n in required: assert html.count(n)==1, f'asset owner problem: {n}'
          local_assets=re.findall(r'(?:src|href)=["\']((?!https://)[^"\']+\.(?:js|css)(?:\?[^"\']*)?)["\']',html)
          bad=[x for x in local_assets if '?v=2.9.0' not in x]
          assert not bad, f'mixed local asset versions: {bad}'
          worker=pathlib.Path('src/worker.js').read_text(encoding='utf-8')
          for n in ['syncVersion:2','baseRevision','SYNC_CONFLICT',"searchParams.get('meta')==='1'","DELETE FROM sessions WHERE expires_at<=?1"]: assert n in worker, n
          assert 'OR user_id=?2' not in worker
          cloud=pathlib.Path('public/features/cloud-sync.js').read_text(encoding='utf-8')
          for n in ['stableSnapshot','delete copy.capturedAt','mergeSnapshots','validateSnapshot','snapshotHasMeaningfulWork','baseRevision','lastAppliedCloudRevision','Cannot sign out safely while offline','Sign out stopped because your binder could not be backed up',"transaction(['binders','pages'],'readwrite')"]: assert n in cloud, n
          assert 'await saveActivePageSnapshot().catch(()=>{})' not in cloud
          safety=pathlib.Path('public/features/data-safety.js').read_text(encoding='utf-8')
          for n in ['Save failed — keep this tab open','visibilitychange','pagehide','saveActivePageSnapshot=async function']: assert n in safety, n
          polish=pathlib.Path('public/features/staging-polish.js').read_text(encoding='utf-8')
          assert 'canvasHeightSync' not in polish and 'prebuilt-catalog-bootstrap.js' not in polish
          rail=pathlib.Path('public/features/staging-v287.js').read_text(encoding='utf-8')
          for n in ['guided-tour-finish.js','guided-tour-step16-fix.js','artwork-height-sync.js']: assert n not in rail, n
          sw=pathlib.Path('src/staging-worker.js').read_text(encoding='utf-8')
          assert "STAGING_BUILD='2.9.0-phase123'" in sw and "redirect:'manual'" in sw and 'Artwork redirect left the approved host list' in sw
          print('STATIC PASS',len(ids),'ids',len(local_assets),'versioned assets')
          PY

      - name: Install browser tooling
        run: |
          npm install --no-save wrangler@4 playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=wrangler.staging.jsonc

      - name: Browser Phase 1-3 regression
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const STAGING='https://kaseys-binder-studio-staging.jin345.workers.dev';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
            const page=await ctx.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            await page.goto(STAGING+'/?qa='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1500);
            if(ctx.serviceWorkers().length)throw new Error('Service worker active');
            const version=(await page.locator('#versionLink').textContent()||'').trim();
            if(version!=='v2.9.0 STAGING')throw new Error('Wrong version '+version);

            const owners=await page.evaluate(()=>({congrats:document.querySelectorAll('#guidedTourCongrats').length,cloud:document.querySelectorAll('#cloudAccountBtn').length,cloudDebug:!!KBSCloudSyncDebug,dataSafety:!!KBSDataSafety,heightSync:!!KBSArtworkHeightSync,finishScripts:[...document.scripts].filter(s=>s.src.includes('guided-tour-finish.js')).length,step16Scripts:[...document.scripts].filter(s=>s.src.includes('guided-tour-step16-fix.js')).length}));
            if(owners.congrats!==1||owners.cloud!==1||!owners.cloudDebug||!owners.dataSafety||!owners.heightSync||owners.finishScripts!==1||owners.step16Scripts!==1)throw new Error('Runtime owner regression '+JSON.stringify(owners));

            const syncCore=await page.evaluate(async()=>{
              const base={format:'KBS-CLOUD-1',capturedAt:1,maxUpdated:10,activeBinderId:'b1',activePageId:'p1',binders:[{id:'b1',name:'A',updatedAt:10}],pages:[{id:'p1',binderId:'b1',order:0,updatedAt:10,state:{}}],editorState:{}};
              const h1=await KBSCloudSyncDebug.snapshotHash(base),h2=await KBSCloudSyncDebug.snapshotHash({...base,capturedAt:999});
              const local={...base,activeBinderId:'b2',activePageId:'p2',binders:[{id:'b2',name:'Local',updatedAt:20}],pages:[{id:'p2',binderId:'b2',order:0,updatedAt:20,state:{subject:'Pikachu'}}]};
              const merged=KBSCloudSyncDebug.mergeSnapshots(base,local);
              return{sameHash:h1===h2,binders:merged.binders.map(x=>x.id).sort().join(','),pages:merged.pages.map(x=>x.id).sort().join(',')};
            });
            if(!syncCore.sameHash||syncCore.binders!=='b1,b2'||syncCore.pages!=='p1,p2')throw new Error('Sync core '+JSON.stringify(syncCore));

            await page.click('#libraryArtworkTab');
            await page.waitForFunction(()=>!!document.querySelector('.library')?.dataset?.canvasHeightSync,null,{timeout:10000});
            const art=await page.evaluate(()=>{const lib=document.querySelector('.library').getBoundingClientRect(),can=document.querySelector('.canvas').getBoundingClientRect(),pane=document.querySelector('.artwork-pane').getBoundingClientRect(),tray=document.querySelector('#arts').getBoundingClientRect();return{libBottom:lib.bottom,canBottom:can.bottom,libHeight:lib.height,canHeight:can.height,paneBottom:pane.bottom,trayBottom:tray.bottom,trayHeight:tray.height}});
            if(Math.abs(art.libBottom-art.canBottom)>6||Math.abs(art.libHeight-art.canHeight)>6||art.paneBottom>art.libBottom+2||art.trayBottom>art.libBottom+2||art.trayHeight<180)throw new Error('Artwork layout '+JSON.stringify(art));

            const appearance=await page.evaluate(()=>[...document.querySelectorAll('.appearance-module .color-control')].map(x=>({label:x.querySelector('strong')?.textContent.trim(),icon:getComputedStyle(x.querySelector('.color-icon')).display,small:getComputedStyle(x.querySelector('small')).display,input:!!x.querySelector('input[type=color]')})));
            if(appearance.map(x=>x.label).join(',')!=='Binder,Page,Sleeves'||appearance.some(x=>x.icon!=='none'||x.small!=='none'||!x.input))throw new Error('Appearance '+JSON.stringify(appearance));

            await page.evaluate(()=>{const d=document.querySelector('#guidedDemo'),n=document.querySelector('#guidedDemoNext');d.hidden=false;d.setAttribute('aria-hidden','false');document.body.classList.add('live-guided-demo-running');n.hidden=false;n.disabled=false;n.textContent='Finish'});
            await page.waitForFunction(()=>document.querySelector('#guidedDemoStep')?.textContent==='STEP 16 OF 16',null,{timeout:5000});
            await page.waitForFunction(()=>document.querySelector('#guidedDemoNext')?.textContent==='Continue',null,{timeout:5000});
            await page.click('#guidedDemoNext');
            await page.waitForFunction(()=>document.querySelector('#guidedTourCongrats')?.hidden===false,null,{timeout:5000});
            const congrats=await page.evaluate(()=>({count:document.querySelectorAll('#guidedTourCongrats').length,title:document.querySelector('#guidedCongratsTitle')?.textContent,confetti:document.querySelectorAll('.guided-confetti-piece').length}));
            if(congrats.count!==1||congrats.title!=='Congratulations!'||congrats.confetti<30)throw new Error('Guided finish '+JSON.stringify(congrats));

            const cfg=await page.request.get(STAGING+'/api/config');if(!cfg.ok())throw new Error('Config failed');
            const cfgData=await cfg.json();if(cfgData.syncVersion!==2)throw new Error('syncVersion '+cfgData.syncVersion);
            const meta=await page.request.get(STAGING+'/api/sync?meta=1');if(meta.status()!==401)throw new Error('Expected sync meta 401, got '+meta.status());
            if(errors.length)throw new Error(errors.join(' | '));
            console.log('PHASE123_BROWSER_PASS',JSON.stringify({version,owners,syncCore,art,appearance,congrats,syncVersion:cfgData.syncVersion}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
