name: Staging v2.8 Sanity

on:
  push:
    branches: [staging-ui-auth-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-staging-sanity
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-ui-auth-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static structure and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/features/cards-lab.js
          node --check public/features/catalog-lab.js
          node --check public/features/art-search-lab.js
          node --check public/features/binder-lab.js
          node --check public/features/mobile-lab.js
          node --check public/features/cloud-sync.js
          node --check src/staging-worker.js
          python - <<'PY'
          import re, pathlib
          html=pathlib.Path('public/index.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          assert 'id="catalogFilter"' not in html, 'Catalog selector still exists'
          assert 'id="setFilter"' in html and 'id="artistFilter"' in html
          assert 'serviceWorker.register' not in html, 'Staging still registers a service worker'
          assert 'art-search-proxy.js' not in html, 'Obsolete artwork proxy still referenced'
          assert 'App notice' in html
          worker=pathlib.Path('src/staging-worker.js').read_text(encoding='utf-8')
          assert '/api/art-search' not in worker, 'Obsolete artwork API still exists'
          assert "url.pathname === '/art-image'" in worker, 'Artwork image endpoint missing'
          cat=pathlib.Path('public/features/catalog-lab.js').read_text(encoding='utf-8')
          for needle in ['TCG Pocket ·','pocket-source-badge','mergePocketIntoMaster','setId:`pocket:${rawSet}`']:
              assert needle in cat, f'missing unified-library feature: {needle}'
          art=pathlib.Path('public/features/art-search-lab.js').read_text(encoding='utf-8')
          assert 'loading="eager"' in art
          assert "'/art-image?src='" in art
          print('STATIC PASS',len(ids),'unique ids')
          PY

      - name: Install Wrangler and Playwright
        run: |
          npm install --no-save wrangler@4 playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Deploy cleaned staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=wrangler.staging.jsonc

      - name: Exercise deployed staging in Chromium
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const URL='https://kaseys-binder-studio-staging.jin345.workers.dev';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
            const page=await ctx.newPage();
            const errors=[],failed=[],artResponses=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));
            page.on('response',r=>{if(r.url().includes('/art-image?'))artResponses.push({url:r.url().slice(0,220),status:r.status(),ct:r.headers()['content-type']||''})});

            await page.goto(URL,{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1500);
            const shell=await page.evaluate(async()=>({
              catalog:!!document.querySelector('#catalogFilter'),
              set:!!document.querySelector('#setFilter'),artist:!!document.querySelector('#artistFilter'),
              swControlled:!!navigator.serviceWorker.controller,
              swRegistration:!!(await navigator.serviceWorker.getRegistration()),
              cloud:!!document.querySelector('.cloud-account')
            }));
            console.log('SHELL',shell);
            if(shell.catalog||!shell.set||!shell.artist)throw new Error('Unified filter shell is incorrect');
            if(shell.swControlled||shell.swRegistration)throw new Error('Staging service worker is still active');
            if(!shell.cloud)throw new Error('Cloud account UI did not mount');

            await page.click('#openBinders');await page.waitForTimeout(300);
            if(await page.locator('#binderModal').getAttribute('aria-hidden')!=='false')throw new Error('Binder modal did not open');
            await page.click('#closeBinders');

            await page.fill('#subject','eevee');
            await page.click('#searchBtn');
            await page.click('#libraryArtworkTab');
            await page.waitForTimeout(10000);
            const art=await page.evaluate(()=>{
              const imgs=[...document.querySelectorAll('#autoArtworkResults img')];
              return {cards:document.querySelectorAll('#autoArtworkResults .auto-art-card').length,loaded:imgs.filter(i=>i.complete&&i.naturalWidth>0).length,broken:imgs.filter(i=>i.complete&&i.naturalWidth===0).length,status:document.querySelector('#autoArtworkStatus')?.textContent||'',sample:imgs.slice(0,5).map(i=>({src:i.currentSrc||i.src,w:i.naturalWidth,h:i.naturalHeight,complete:i.complete}))};
            });
            console.log('ARTWORK',JSON.stringify(art,null,2));
            console.log('ART_IMAGE_RESPONSES',JSON.stringify(artResponses.slice(0,20),null,2));
            if(art.cards<10)throw new Error('Expected >=10 artwork cards, got '+art.cards);
            if(art.loaded<10)throw new Error(`Artwork pixels failed: loaded=${art.loaded}, broken=${art.broken}`);
            const goodProxy=artResponses.filter(x=>x.status===200&&String(x.ct).startsWith('image/')).length;
            if(goodProxy<8)throw new Error('Same-origin artwork image endpoint did not return enough valid images: '+goodProxy);

            const trayBefore=await page.locator('#arts').locator(':scope > *').count();
            await page.locator('#autoArtworkResults .auto-art-add').nth(2).click();await page.waitForTimeout(500);
            const trayAfter=await page.locator('#arts').locator(':scope > *').count();
            console.log('ART_TRAY',trayBefore,'->',trayAfter);
            if(trayAfter<=trayBefore)throw new Error('Artwork did not add to Art Tray');

            const before=art.cards;
            if(!(await page.isDisabled('#autoArtworkLoadMore'))){await page.click('#autoArtworkLoadMore');await page.waitForTimeout(1500);const after=await page.locator('#autoArtworkResults .auto-art-card').count();console.log('MORE',before,'->',after);if(after<=before)throw new Error('More artwork did not append');}

            await page.click('#libraryCardsTab');
            await page.evaluate(()=>document.querySelector('#syncMasterLibrary')?.click());
            await page.waitForTimeout(20000);
            const lib=await page.evaluate(()=>({hidden:document.querySelector('#runtimeErrorBanner')?.hidden,text:document.querySelector('#runtimeErrorText')?.textContent||'',status:document.querySelector('#masterLibraryStatus')?.textContent||'',progress:document.querySelector('#libraryProgressText')?.textContent||''}));
            console.log('LIBRARY',lib);
            if(lib.hidden===false)throw new Error('Unexpected app notice during English build: '+lib.text);
            if(!/Building|Library|catalog/i.test(lib.status+' '+lib.progress))throw new Error('Library did not start/progress');

            await page.click('#mobilePreviewToggle');await page.waitForTimeout(300);
            const mobile=await page.evaluate(()=>({enabled:document.body.classList.contains('mobile-lab-enabled'),nav:!!document.querySelector('#mobileLabBottomNav')}));
            console.log('MOBILE',mobile);if(!mobile.enabled||!mobile.nav)throw new Error('Mobile preview failed');

            const cfg=await page.request.get(URL+'/api/config');console.log('AUTH_CONFIG',cfg.status());if(!cfg.ok())throw new Error('/api/config failed');
            console.log('FAILED',JSON.stringify(failed.filter(x=>/art-image|raw\.githubusercontent\.com/.test(x.url)).slice(0,30),null,2));
            console.log('CONSOLE_ERRORS',JSON.stringify(errors.slice(0,30),null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
