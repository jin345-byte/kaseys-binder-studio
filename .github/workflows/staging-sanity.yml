name: Staging v2.8 Sanity

on:
  push:
    branches: [staging-ui-auth-test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binder-studio-staging-sanity
  cancel-in-progress: false

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-ui-auth-test
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure direct-renderable Safebooru cache
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path
          existing=Path('public/art-cache/eevee.json')
          try:
              rows=json.loads(existing.read_text(encoding='utf-8')).get('results',[])
              if len(rows)>=10 and all('safebooru.org' in str(x.get('url','')) for x in rows[:10]):
                  print('Safebooru cache already present; rebuild not needed.')
                  raise SystemExit(0)
          except Exception:
              pass

          UA='Kaseys-Binder-Studio-Safebooru-Cache/2.8.2'
          OUT='public/art-cache'; os.makedirs(OUT,exist_ok=True)
          def get_json(url,retries=4):
              last=None
              for attempt in range(retries+1):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          return json.loads(r.read().decode('utf-8','replace'))
                  except Exception as e:
                      last=e
                      if attempt<retries: time.sleep(min(1.0*(2**attempt),8))
              raise last
          species=get_json('https://pokeapi.co/api/v2/pokemon-species?limit=2000').get('results',[])
          names=[x.get('name','') for x in species if x.get('name')]
          def key(name): return name.lower().replace('-','_')
          def candidates(name):
              out=[]
              for v in [key(name),name.lower()]:
                  if v and v not in out: out.append(v)
              return out
          def normalize(posts):
              rows=[]; seen=set()
              for p in posts if isinstance(posts,list) else []:
                  directory=str(p.get('directory','')).strip(); image=str(p.get('image','')).strip()
                  constructed=f'https://safebooru.org/images/{urllib.parse.quote(directory)}/{urllib.parse.quote(image)}' if directory and image else ''
                  thumb_name='thumbnail_'+image if image else ''
                  constructed_thumb=f'https://safebooru.org/thumbnails/{urllib.parse.quote(directory)}/{urllib.parse.quote(thumb_name)}' if directory and thumb_name else ''
                  url=p.get('file_url') or p.get('sample_url') or constructed
                  thumb=p.get('preview_url') or p.get('sample_url') or constructed_thumb or url
                  if not isinstance(url,str) or not url.startswith('https://safebooru.org/'): continue
                  if url in seen: continue
                  seen.add(url)
                  rows.append({'id':str(p.get('id') or ''),'url':url,'thumb':thumb if isinstance(thumb,str) and thumb.startswith('https://safebooru.org/') else url,'width':int(p.get('width') or 0),'height':int(p.get('height') or 0),'source':'Safebooru fan art'})
              return rows
          def fetch_rows(name):
              best=[]; used=''
              for tag in candidates(name):
                  params=urllib.parse.urlencode({'page':'dapi','s':'post','q':'index','json':'1','limit':'40','pid':'0','tags':tag})
                  try: payload=get_json('https://safebooru.org/index.php?'+params,retries=3)
                  except Exception as e:
                      print('WARN',name,tag,repr(e)); continue
                  posts=payload if isinstance(payload,list) else (payload.get('post',[]) if isinstance(payload,dict) else [])
                  rows=normalize(posts)
                  if len(rows)>len(best): best,used=rows,tag
                  if len(best)>=20: break
              return best[:40],used
          counts={}; total=0
          for i,name in enumerate(names,1):
              rows,tag=fetch_rows(name); k=key(name); counts[k]=len(rows); total+=len(rows)
              with open(os.path.join(OUT,k+'.json'),'w',encoding='utf-8') as f:
                  json.dump({'pokemon':name,'tag':tag,'results':rows},f,separators=(',',':'))
              if i%25==0 or i==len(names): print('PROGRESS',i,'/',len(names),'rows',total)
              time.sleep(.08)
          required=['eevee','pikachu','gardevoir','charizard','umbreon']
          print('REQUIRED',{x:counts.get(x,0) for x in required})
          weak=[x for x in required if counts.get(x,0)<10]
          if weak: raise SystemExit('Required caches weak: '+','.join(weak))
          with open(os.path.join(OUT,'index.json'),'w',encoding='utf-8') as f:
              json.dump({'provider':'safebooru','species':len(names),'artworkRows':total,'counts':counts,'generatedAt':int(time.time())},f,separators=(',',':'))
          print('CACHE PASS',len(names),'species',total,'rows')
          PY

      - name: Static structure and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/features/cards-lab.js
          node --check public/features/catalog-lab.js
          node --check public/features/art-search-lab.js
          node --check public/features/binder-lab.js
          node --check public/features/mobile-lab.js
          node --check public/features/cloud-sync.js
          node --check src/staging-worker.js
          python - <<'PY'
          import re, pathlib, json
          html=pathlib.Path('public/index.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          assert 'id="catalogFilter"' not in html
          assert 'id="setFilter"' in html and 'id="artistFilter"' in html
          assert 'serviceWorker.register' not in html and 'art-search-proxy.js' not in html
          worker=pathlib.Path('src/staging-worker.js').read_text(encoding='utf-8')
          assert '/api/art-search' not in worker and '/art-image' not in worker
          cat=pathlib.Path('public/features/catalog-lab.js').read_text(encoding='utf-8')
          for needle in ['TCG Pocket ·','pocket-source-badge','mergePocketIntoMaster','setId:`pocket:${rawSet}`']:
              assert needle in cat, f'missing unified feature: {needle}'
          art=pathlib.Path('public/features/art-search-lab.js').read_text(encoding='utf-8')
          assert 'safeFanUrl' in art and 'safebooru.org' in art and '/art-image?src=' not in art and 'loading="eager"' in art
          eevee=json.loads(pathlib.Path('public/art-cache/eevee.json').read_text(encoding='utf-8'))
          rows=eevee.get('results',[])
          assert len(rows)>=10 and all('safebooru.org' in str(x.get('url','')) for x in rows[:10])
          print('STATIC PASS',len(ids),'unique ids',len(rows),'eevee fan-art rows')
          PY

      - name: Install Wrangler and browser tooling
        run: |
          npm install --no-save wrangler@4 playwright@1.55.0 pngjs@7 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Deploy cleaned staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=wrangler.staging.jsonc

      - name: End-to-end Chromium sanity
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const {PNG}=require('pngjs');
          const fs=require('fs');
          const URL='https://kaseys-binder-studio-staging.jin345.workers.dev';
          function variance(path){const p=PNG.sync.read(fs.readFileSync(path));let n=0,sum=0,sum2=0;for(let y=8;y<p.height-8;y+=2)for(let x=8;x<p.width-8;x+=2){const i=(y*p.width+x)*4;if(p.data[i+3]<30)continue;const v=.2126*p.data[i]+.7152*p.data[i+1]+.0722*p.data[i+2];n++;sum+=v;sum2+=v*v}const m=sum/Math.max(1,n);return Math.sqrt(Math.max(0,sum2/Math.max(1,n)-m*m));}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
            const page=await ctx.newPage();
            const errors=[],failed=[],safeResponses=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));
            page.on('response',r=>{if(r.url().includes('safebooru.org/')&&!r.url().includes('index.php'))safeResponses.push({url:r.url().slice(0,180),status:r.status(),ct:r.headers()['content-type']||''})});
            await page.goto(URL,{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(1200);
            if(await page.locator('#catalogFilter').count())throw new Error('Catalog selector exists');
            for(const s of ['#setFilter','#artistFilter','#libraryCardsTab','#libraryArtworkTab','.cloud-account'])if(await page.locator(s).count()!==1)throw new Error('Missing UI '+s);
            if(ctx.serviceWorkers().length)throw new Error('Service worker still active');
            await page.click('#openBinders'); await page.waitForTimeout(250);
            if(await page.locator('#binderModal').getAttribute('aria-hidden')!=='false')throw new Error('Binder modal failed');
            await page.click('#closeBinders');
            await page.fill('#subject','eevee'); await page.click('#searchBtn'); await page.click('#libraryArtworkTab'); await page.waitForTimeout(8000);
            const cards=await page.locator('#autoArtworkResults .auto-art-card').count(); const imgs=page.locator('#autoArtworkResults img'); const imgCount=await imgs.count();
            console.log('ARTWORK_COUNTS',{cards,imgCount}); console.log('SAFE_RESPONSES',JSON.stringify(safeResponses.slice(0,20),null,2));
            if(cards<10||imgCount<10)throw new Error('Artwork results incomplete');
            const good=safeResponses.filter(x=>x.status===200&&String(x.ct).startsWith('image/')).length; if(good<8)throw new Error('Only '+good+' Safebooru images loaded');
            let fan=-1; for(let i=0;i<imgCount;i++){const src=(await imgs.nth(i).getAttribute('src'))||'';if(src.includes('safebooru.org/')){fan=i;break;}}
            if(fan<0)throw new Error('No Safebooru artwork rendered');
            await imgs.nth(fan).screenshot({path:'fan.png'}); const v=variance('fan.png'); console.log('ART_PIXEL_VARIANCE',v); if(v<=8)throw new Error('Artwork visually blank');
            const before=await page.locator('#arts > *').count(); await page.locator('#autoArtworkResults .auto-art-add').nth(fan).click(); await page.waitForTimeout(400); const after=await page.locator('#arts > *').count(); if(after<=before)throw new Error('Add to Art Tray failed');
            if(!(await page.isDisabled('#autoArtworkLoadMore'))){const c0=cards;await page.click('#autoArtworkLoadMore');await page.waitForTimeout(1000);const c1=await page.locator('#autoArtworkResults .auto-art-card').count();if(c1<=c0)throw new Error('More artwork failed');}
            await page.click('#libraryCardsTab'); await page.locator('#syncMasterLibrary').click({force:true}); await page.waitForTimeout(20000);
            const banner=await page.locator('#runtimeErrorBanner').isVisible(); const txt=(await page.locator('#runtimeErrorText').textContent())||''; const libStatus=((await page.locator('#masterLibraryStatus').textContent())||'')+' '+((await page.locator('#libraryProgressText').textContent())||'');
            console.log('LIBRARY',{banner,txt,libStatus}); if(banner)throw new Error('Unexpected app notice: '+txt); if(!/Building|Library|catalog/i.test(libStatus)throw new Error('Library did not progress');
            await page.click('#mobilePreviewToggle'); await page.waitForTimeout(250); const cls=(await page.locator('body').getAttribute('class'))||''; if(!cls.includes('mobile-lab-enabled'))throw new Error('Mobile preview failed');
            const cfg=await page.request.get(URL+'/api/config'); if(!cfg.ok())throw new Error('Auth config failed');
            console.log('AUTH_CONFIG',cfg.status()); console.log('RELEVANT_FAILED',JSON.stringify(failed.filter(x=>/safebooru|raw\.githubusercontent/.test(x.url)).slice(0,25),null,2)); console.log('CONSOLE_ERRORS',JSON.stringify(errors.slice(0,25),null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Persist validated Safebooru cache
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/art-cache
          if git diff --cached --quiet; then
            echo 'Validated cache already persisted.'
          else
            git commit -m 'Persist validated Safebooru artwork cache [art-cache-built]'
            git push origin HEAD:staging-ui-auth-test
          fi
