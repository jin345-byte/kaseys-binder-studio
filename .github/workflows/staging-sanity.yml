name: Staging v2.8 Sanity

on:
  push:
    branches: [staging-ui-auth-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-staging-sanity
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-ui-auth-test
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static structure and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/features/cards-lab.js
          node --check public/features/catalog-lab.js
          node --check public/features/art-search-lab.js
          node --check public/features/binder-lab.js
          node --check public/features/mobile-lab.js
          node --check public/features/cloud-sync.js
          node --check public/features/staging-fetch-shim.js
          node --check public/features/staging-polish.js
          node --check src/staging-worker.js
          python - <<'PY'
          import re, pathlib, json
          html=pathlib.Path('public/index.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          assert 'id="catalogFilter"' not in html
          assert 'id="setFilter"' in html and 'id="artistFilter"' in html
          assert 'serviceWorker.register' not in html and 'art-search-proxy.js' not in html
          assert '<strong>App notice</strong>' in html
          assert 'v2.8.6 STAGING' in html and 'v2.8.6 Staging' in html
          assert 'staging-polish.js?v=2.8.6' in html and 'styles/staging-polish.css?v=2.8.6' in html
          assert 'pikachu-bolt' not in html and 'library-build-icon' not in html
          worker=pathlib.Path('src/staging-worker.js').read_text(encoding='utf-8')
          assert '/api/art-search' not in worker
          for route in ["/api/art-image","/api/art-feed","/api/card-search"]: assert route in worker
          art=pathlib.Path('public/features/art-search-lab.js').read_text(encoding='utf-8')
          assert 'data-art-size' not in art and 'auto-art-size' not in art
          assert '/api/art-feed?' in art and 'nextPid' in art and 'exhausted' in art
          polish=pathlib.Path('public/features/staging-polish.js').read_text(encoding='utf-8')
          assert 'artworkHoverPreview' in polish and "addEventListener('wheel'" in polish
          assert 'brand-animated' in polish and 'scrollIntoView' in polish
          css=pathlib.Path('public/styles/staging-polish.css').read_text(encoding='utf-8')
          for needle in ['page-card-actions','repeat(4,minmax(0,1fr))','border-radius:50%','kbsLogoKick','grid-template-columns:30px minmax(0,1fr) 30px','overflow-x:auto']:
              assert needle in css, f'missing polish css: {needle}'
          eevee=json.loads(pathlib.Path('public/art-cache/eevee.json').read_text(encoding='utf-8'))
          assert len(eevee.get('results',[]))>=10
          print('STATIC PASS',len(ids),'unique ids')
          PY

      - name: Install Wrangler and browser tooling
        run: |
          npm install --no-save wrangler@4 playwright@1.55.0 pngjs@7 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Deploy cleaned staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=wrangler.staging.jsonc

      - name: End-to-end Chromium sanity
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const {PNG}=require('pngjs');
          const fs=require('fs');
          const STAGING='https://kaseys-binder-studio-staging.jin345.workers.dev';
          function variance(path){const p=PNG.sync.read(fs.readFileSync(path));let n=0,sum=0,sum2=0;for(let y=8;y<p.height-8;y+=2)for(let x=8;x<p.width-8;x+=2){const i=(y*p.width+x)*4;if(p.data[i+3]<30)continue;const v=.2126*p.data[i]+.7152*p.data[i+1]+.0722*p.data[i+2];n++;sum+=v;sum2+=v*v}const m=sum/Math.max(1,n);return Math.sqrt(Math.max(0,sum2/Math.max(1,n)-m*m));}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
            const page=await ctx.newPage();
            const errors=[],failed=[],artResponses=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));
            page.on('response',r=>{if(r.url().includes('/api/art-image?'))artResponses.push({status:r.status(),ct:r.headers()['content-type']||'',marker:r.headers()['x-kbs-art-image']||''})});

            let version='';
            for(let attempt=0;attempt<6;attempt++){
              await page.goto(STAGING+'/?qa='+Date.now(),{waitUntil:'networkidle',timeout:60000});
              await page.waitForTimeout(900);
              version=((await page.locator('#versionLink').textContent().catch(()=>''))||'').trim();
              if(version==='v2.8.6 STAGING')break;
              await page.waitForTimeout(2500);
            }
            if(version!=='v2.8.6 STAGING')throw new Error('Visible version stale after propagation wait: '+version);
            if(ctx.serviceWorkers().length)throw new Error('Service worker active');
            if(await page.locator('#catalogFilter').count())throw new Error('Catalog selector exists');
            if(await page.locator('.pikachu-bolt,.library-build-icon').count())throw new Error('Library decoration still present');
            if(await page.locator('.brand-char').count()<10)throw new Error('Animated brand title did not initialize');

            await page.click('#mobilePreviewToggle');await page.waitForTimeout(250);
            const top=await page.locator('.top').boundingBox(),brand=await page.locator('.brand').boundingBox(),actions=await page.locator('.top-actions').boundingBox();
            if(!top||!brand||!actions||actions.y<brand.y+brand.height-2)throw new Error('Mobile header is still bunched into one row');
            const actionChildren=page.locator('.top-actions>*');for(let i=0;i<await actionChildren.count();i++){const b=await actionChildren.nth(i).boundingBox();if(b&&b.x+b.width>top.x+top.width+1)throw new Error('Mobile header action overflow');}
            const nav=await page.locator('#editorPageNav').boundingBox();const prev=await page.locator('#editorPrev').boundingBox(),next=await page.locator('#editorNext').boundingBox();if(nav&&prev&&next&&(prev.x<nav.x-1||next.x+next.width>nav.x+nav.width+1))throw new Error('Page arrows overflow live binder control');
            await page.click('#mobilePreviewToggle');

            await page.click('#openBinders');await page.waitForTimeout(250);
            const pageCard=page.locator('#pageBrowser .page-card').first();
            if(await pageCard.count()){
              const cardBox=await pageCard.boundingBox();const buttons=pageCard.locator('.page-card-actions button');
              for(let i=0;i<await buttons.count();i++){const b=await buttons.nth(i).boundingBox();if(b.x<cardBox.x-1||b.x+b.width>cardBox.x+cardBox.width+1)throw new Error('Page action button overflow');}
            }
            await page.click('#closeBinders');

            await page.fill('#subject','eevee');await page.click('#searchBtn');await page.click('#libraryArtworkTab');await page.waitForTimeout(12000);
            if(await page.locator('#autoArtworkResults [data-art-size],#autoArtworkResults .auto-art-size').count())throw new Error('Artwork slot-size selector still present');
            let artCount=await page.locator('#autoArtworkResults .auto-art-card').count();
            const imgs=page.locator('#autoArtworkResults img');const decoded=await imgs.evaluateAll(nodes=>nodes.filter(i=>i.complete&&i.naturalWidth>0&&i.naturalHeight>0).length);
            const good=artResponses.filter(x=>x.status===200&&x.marker==='proxy'&&x.ct.startsWith('image/')).length;
            if(artCount<10||decoded<8||good<8)throw new Error('Artwork render incomplete');
            await imgs.first().hover();await page.waitForTimeout(150);if(!(await page.locator('#artworkHoverPreview').isVisible()))throw new Error('Artwork hover preview did not open');
            await imgs.first().screenshot({path:'art.png'});if(variance('art.png')<=8)throw new Error('Artwork visually blank');
            for(let i=0;i<3;i++){
              if(await page.isDisabled('#autoArtworkLoadMore'))break;
              const before=await page.locator('#autoArtworkResults .auto-art-card').count();await page.click('#autoArtworkLoadMore');
              await page.waitForFunction(n=>document.querySelectorAll('#autoArtworkResults .auto-art-card').length>n,before,{timeout:30000}).catch(()=>{});
            }
            artCount=await page.locator('#autoArtworkResults .auto-art-card').count();if(artCount<=42)throw new Error('Artwork still capped near old limit');

            const beforeTray=await page.locator('#arts .item').count();await page.locator('#autoArtworkResults .auto-art-add').first().click();await page.waitForTimeout(350);if(await page.locator('#arts .item').count()!==beforeTray+1)throw new Error('Add artwork failed');
            await page.locator('#arts .item .pick').first().click();await page.locator('#grid .pocket').first().click();await page.waitForTimeout(350);
            const placed=page.locator('#grid .pocket.art img').first();if(!(await placed.count()))throw new Error('Artwork did not place in binder');
            const z0=await placed.evaluate(el=>getComputedStyle(el).transform);await placed.hover();await page.mouse.wheel(0,-120);await page.waitForTimeout(180);const z1=await placed.evaluate(el=>getComputedStyle(el).transform);if(z0===z1)throw new Error('Artwork wheel zoom did not change image scale');

            await page.click('#libraryCardsTab');await page.locator('#syncMasterLibrary').click({force:true});
            await page.waitForFunction(()=>[...document.querySelectorAll('#setFilter option')].some(o=>String(o.value).startsWith('pocket:')),null,{timeout:120000});
            const pocketValue=await page.locator('#setFilter option[value^="pocket:"]').first().getAttribute('value');await page.fill('#subject','');await page.waitForTimeout(350);await page.selectOption('#setFilter',pocketValue);await page.waitForTimeout(800);
            const pc=await page.locator('#cards .card-item.is-pocket-card').count(),pb=await page.locator('#cards .pocket-source-badge').count();if(pc<1||pb<1)throw new Error('Pocket filter failed');
            const banner=await page.locator('#runtimeErrorBanner').isVisible();if(banner)throw new Error('Unexpected App notice: '+await page.locator('#runtimeErrorText').textContent());
            const cfg=await page.request.get(STAGING+'/api/config');if(!cfg.ok())throw new Error('Auth config failed');
            if(errors.length)throw new Error('Browser console/page errors: '+errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
