name: Staging v2.8 Sanity

on:
  push:
    branches: [staging-ui-auth-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-staging-sanity
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-ui-auth-test
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static structure and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in public/app.js public/features/cards-lab.js public/features/catalog-lab.js public/features/art-search-lab.js public/features/binder-lab.js public/features/mobile-lab.js public/features/cloud-sync.js public/features/staging-fetch-shim.js public/features/staging-polish.js public/features/help-lab.js src/staging-worker.js; do node --check "$f"; done
          python - <<'PY'
          import re,pathlib
          html=pathlib.Path('public/index.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          assert 'id="catalogFilter"' not in html
          assert 'serviceWorker.register' not in html

          tour=pathlib.Path('public/features/help-lab.js').read_text(encoding='utf-8')
          assert '#catalogFilter' not in tour
          for needle in [
              "name:'Gardevoir',set:'Ruby & Sapphire',number:'7'",
              "name:'Gardevoir ex',set:'Paldean Fates',number:'233'",
              '#libraryArtworkTab',
              'searchGardevoir()',
              'moveCard(card,spec.slot)',
              'addDemoArt(G.art[0])',
              'Click Build Card Library once',
              'Open the Artwork tab',
              'Place cards on the page'
          ]:
              assert needle in tour, f'missing restored demo/instruction: {needle}'

          rail=pathlib.Path('public/styles/staging-v288-fix.css').read_text(encoding='utf-8')
          for needle in [
              'grid-template-columns:minmax(0,1fr) 44px',
              'grid-column:2',
              'flex-direction:column',
              'visibility:visible',
              'kbsV288PagePop'
          ]:
              assert needle in rail, f'missing persistent page rail rule: {needle}'

          polish=pathlib.Path('public/features/staging-polish.js').read_text(encoding='utf-8')
          assert 'staging-v288-fix.css?v=2.8.8' in polish
          assert 'page-switch-pop' in polish and 'scrollIntoView' in polish
          assert 'canvasHeightSync' in polish and 'ResizeObserver' in polish

          worker=pathlib.Path('src/staging-worker.js').read_text(encoding='utf-8')
          for route in ['/api/art-image','/api/art-feed','/api/card-search']:
              assert route in worker
          print('STATIC PASS',len(ids),'unique ids')
          PY

      - name: Install Wrangler and browser tooling
        run: |
          npm install --no-save wrangler@4 playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=wrangler.staging.jsonc

      - name: Guided tour, artwork height, and page rail browser sanity
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const STAGING='https://kaseys-binder-studio-staging.jin345.workers.dev';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
            const page=await ctx.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});

            await page.goto(STAGING+'/?qa='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1100);

            if(ctx.serviceWorkers().length)throw new Error('Service worker active');
            if(await page.locator('#catalogFilter').count())throw new Error('Removed Catalog selector returned');

            const compact=await page.locator('#syncMasterLibrary').boundingBox();
            if(!compact||compact.height>38)throw new Error('Build Card Library is not compact');

            /* Regression check for the large dead space formerly below Artwork. */
            await page.click('#libraryArtworkTab');
            await page.waitForFunction(()=>!!document.querySelector('.library')?.dataset?.canvasHeightSync,null,{timeout:10000});
            await page.waitForTimeout(250);
            const artLayout=await page.evaluate(()=>{
              const lib=document.querySelector('.library'),canvas=document.querySelector('.canvas'),pane=document.querySelector('.artwork-pane'),results=document.querySelector('#autoArtworkSection'),arts=document.querySelector('#arts');
              const lr=lib.getBoundingClientRect(),cr=canvas.getBoundingClientRect(),pr=pane.getBoundingClientRect(),rr=results.getBoundingClientRect(),ar=arts.getBoundingClientRect();
              return {library:{bottom:lr.bottom,height:lr.height},canvas:{bottom:cr.bottom,height:cr.height},pane:{bottom:pr.bottom},results:{height:rr.height},tray:{bottom:ar.bottom},sync:lib.dataset.canvasHeightSync||''};
            });
            console.log('ARTWORK_LAYOUT',JSON.stringify(artLayout));
            if(Math.abs(artLayout.library.bottom-artLayout.canvas.bottom)>6)throw new Error('Artwork library does not reach canvas bottom: '+JSON.stringify(artLayout));
            if(Math.abs(artLayout.library.height-artLayout.canvas.height)>6)throw new Error('Artwork library/canvas height mismatch: '+JSON.stringify(artLayout));
            if(artLayout.pane.bottom>artLayout.library.bottom+2||artLayout.tray.bottom>artLayout.library.bottom+2)throw new Error('Artwork content overflows its panel: '+JSON.stringify(artLayout));
            if(artLayout.results.height<300)throw new Error('Matching Artwork area is too short: '+JSON.stringify(artLayout));

            await page.waitForFunction(()=>!!document.querySelector('link[data-kbs-v288-rail]'),null,{timeout:10000});
            const rail=page.locator('#editorPageNav');
            const railBox=await rail.boundingBox();
            const direction=await page.locator('#editorPageNumbers').evaluate(el=>getComputedStyle(el).flexDirection);
            const headingBox=await page.locator('.binder-heading-module').boundingBox();
            const libraryBox=await page.locator('#librarySetupCard').boundingBox();
            if(!railBox||!headingBox||!libraryBox)throw new Error('Live Binder rail or controls are missing');
            if(railBox.width>38)throw new Error('Live Binder page navigation is still wide: '+railBox.width);
            if(direction!=='column')throw new Error('Page numbers are not vertical: '+direction);
            if(headingBox.x<=libraryBox.x)throw new Error('Page rail is not positioned to the right of the controls');
            if((await rail.evaluate(el=>getComputedStyle(el).visibility))!=='visible')throw new Error('Page rail is hidden');

            await page.click('#guidedTourLaunch');
            await page.waitForTimeout(250);
            const title1=(await page.locator('#guidedDemoTitle').textContent()).trim();
            const text1=(await page.locator('#guidedDemoText').textContent()).trim();
            if(title1!=='Build the card library')throw new Error('Gardevoir tour did not start at the library step');
            if(!text1.includes('Click Build Card Library once'))throw new Error('Tour bubble is not instruction-focused');
            if(!(await page.locator('body').evaluate(el=>el.classList.contains('live-guided-demo-running'))))throw new Error('Guided demonstration is not running');

            await page.waitForTimeout(4300);
            const title2=(await page.locator('#guidedDemoTitle').textContent()).trim();
            if(title2!=='Choose a page layout')throw new Error('Automatic Gardevoir demonstration did not advance');
            if(await page.locator('#layout').inputValue()!=='3x3')throw new Error('Guided demonstration did not perform the layout action');

            await page.keyboard.press('Escape');
            await page.waitForTimeout(200);
            if(await page.locator('#guidedDemo').isVisible())throw new Error('Escape did not close the demonstration');

            const cfg=await page.request.get(STAGING+'/api/config');
            if(!cfg.ok())throw new Error('Auth config failed');
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
