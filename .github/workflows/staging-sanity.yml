name: Staging v2.8 Sanity

on:
  push:
    branches: [staging-ui-auth-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-staging-sanity
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-ui-auth-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static structure and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/features/cards-lab.js
          node --check public/features/catalog-lab.js
          node --check public/features/art-search-lab.js
          node --check public/features/binder-lab.js
          node --check public/features/mobile-lab.js
          node --check public/features/cloud-sync.js
          node --check src/staging-worker.js
          python - <<'PY'
          import re, pathlib
          html=pathlib.Path('public/index.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          assert 'id="catalogFilter"' not in html
          assert 'id="setFilter"' in html and 'id="artistFilter"' in html
          assert 'serviceWorker.register' not in html
          assert 'art-search-proxy.js' not in html
          assert 'App notice' in html
          worker=pathlib.Path('src/staging-worker.js').read_text(encoding='utf-8')
          assert '/api/art-search' not in worker
          assert "url.pathname === '/art-image'" in worker
          cat=pathlib.Path('public/features/catalog-lab.js').read_text(encoding='utf-8')
          for needle in ['TCG Pocket ·','pocket-source-badge','mergePocketIntoMaster','setId:`pocket:${rawSet}`']:
              assert needle in cat, f'missing unified-library feature: {needle}'
          art=pathlib.Path('public/features/art-search-lab.js').read_text(encoding='utf-8')
          assert 'loading="eager"' in art and "'/art-image?src='" in art
          print('STATIC PASS',len(ids),'unique ids')
          PY

      - name: Install Wrangler and Playwright
        run: |
          npm install --no-save wrangler@4 playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Deploy cleaned staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=wrangler.staging.jsonc

      - name: Exercise deployed staging in Chromium
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const URL='https://kaseys-binder-studio-staging.jin345.workers.dev';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
            const page=await ctx.newPage();
            const errors=[],failed=[],artResponses=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));
            page.on('response',r=>{if(r.url().includes('/art-image?'))artResponses.push({url:r.url().slice(0,220),status:r.status(),ct:r.headers()['content-type']||''})});

            await page.goto(URL,{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1500);
            if(await page.locator('#catalogFilter').count())throw new Error('Catalog selector still exists');
            for(const s of ['#setFilter','#artistFilter','#libraryCardsTab','#libraryArtworkTab','.cloud-account'])if(await page.locator(s).count()!==1)throw new Error('Missing shell UI '+s);
            if(ctx.serviceWorkers().length)throw new Error('Staging service worker still active');

            await page.click('#openBinders');await page.waitForTimeout(300);
            if(await page.locator('#binderModal').getAttribute('aria-hidden')!=='false')throw new Error('Binder modal did not open');
            await page.click('#closeBinders');

            await page.fill('#subject','eevee');
            await page.click('#searchBtn');
            await page.click('#libraryArtworkTab');
            await page.waitForTimeout(10000);
            const cards=await page.locator('#autoArtworkResults .auto-art-card').count();
            const imgs=page.locator('#autoArtworkResults img');
            const imgCount=await imgs.count();
            let loaded=0,broken=0;const sample=[];
            for(let i=0;i<imgCount;i++){
              const info=await imgs.nth(i).evaluate(el=>({w:el.naturalWidth,h:el.naturalHeight,complete:el.complete,src:el.currentSrc||el.src}));
              if(info.complete&&info.w>0)loaded++; else if(info.complete&&info.w===0)broken++;
              if(i<5)sample.push(info);
            }
            console.log('ARTWORK',{cards,imgCount,loaded,broken,sample});
            console.log('ART_IMAGE_RESPONSES',JSON.stringify(artResponses.slice(0,20),null,2));
            if(cards<10)throw new Error('Expected >=10 artwork cards, got '+cards);
            if(loaded<10)throw new Error(`Artwork pixels failed: loaded=${loaded}, broken=${broken}`);
            const goodProxy=artResponses.filter(x=>x.status===200&&String(x.ct).startsWith('image/')).length;
            if(goodProxy<8)throw new Error('Artwork image endpoint returned only '+goodProxy+' valid images');

            const trayBefore=await page.locator('#arts > *').count();
            await page.locator('#autoArtworkResults .auto-art-add').nth(2).click();await page.waitForTimeout(500);
            const trayAfter=await page.locator('#arts > *').count();
            console.log('ART_TRAY',trayBefore,'->',trayAfter);if(trayAfter<=trayBefore)throw new Error('Artwork add failed');

            if(!(await page.isDisabled('#autoArtworkLoadMore'))){const before=cards;await page.click('#autoArtworkLoadMore');await page.waitForTimeout(1200);const after=await page.locator('#autoArtworkResults .auto-art-card').count();console.log('MORE',before,'->',after);if(after<=before)throw new Error('More artwork failed');}

            await page.click('#libraryCardsTab');
            await page.locator('#syncMasterLibrary').dispatchEvent('click');
            await page.waitForTimeout(20000);
            const bannerVisible=await page.locator('#runtimeErrorBanner').isVisible();
            const bannerText=(await page.locator('#runtimeErrorText').textContent())||'';
            const libStatus=((await page.locator('#masterLibraryStatus').textContent())||'')+' '+((await page.locator('#libraryProgressText').textContent())||'');
            console.log('LIBRARY',{bannerVisible,bannerText,libStatus});
            if(bannerVisible)throw new Error('Unexpected app notice during English library build: '+bannerText);
            if(!/Building|Library|catalog/i.test(libStatus))throw new Error('Library did not start/progress');

            await page.click('#mobilePreviewToggle');await page.waitForTimeout(300);
            const bodyClass=(await page.locator('body').getAttribute('class'))||'';
            if(!bodyClass.includes('mobile-lab-enabled')||await page.locator('#mobileLabBottomNav').count()!==1)throw new Error('Mobile preview failed');

            const cfg=await page.request.get(URL+'/api/config');if(!cfg.ok())throw new Error('/api/config failed');
            console.log('AUTH_CONFIG',cfg.status());
            console.log('FAILED',JSON.stringify(failed.filter(x=>/art-image|raw\.githubusercontent\.com/.test(x.url)).slice(0,30),null,2));
            console.log('CONSOLE_ERRORS',JSON.stringify(errors.slice(0,30),null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
