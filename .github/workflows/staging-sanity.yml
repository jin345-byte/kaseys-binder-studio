name: Staging v2.8 Sanity

on:
  push:
    branches: [staging-ui-auth-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static structure and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/features/cards-lab.js
          node --check public/features/catalog-lab.js
          node --check public/features/art-search-lab.js
          node --check public/features/binder-lab.js
          node --check public/features/mobile-lab.js
          node --check src/staging-worker.js
          python - <<'PY'
          import re, pathlib
          html=pathlib.Path('public/index.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          assert 'id="catalogFilter"' not in html, 'Catalog selector still exists'
          assert 'serviceWorker.register' not in html, 'Staging still registers a service worker'
          assert 'art-search-proxy.js' not in html, 'Obsolete artwork proxy still referenced'
          worker=pathlib.Path('src/staging-worker.js').read_text(encoding='utf-8')
          assert '/api/art-search' not in worker, 'Obsolete artwork API still exists'
          cat=pathlib.Path('public/features/catalog-lab.js').read_text(encoding='utf-8')
          for needle in ['TCG Pocket ·','pocket-source-badge','mergePocketIntoMaster','Build Card Library']:
              assert needle in cat, f'missing unified-library feature: {needle}'
          art=pathlib.Path('public/features/art-search-lab.js').read_text(encoding='utf-8')
          assert 'loading="eager"' in art, 'Artwork thumbnails are not eager-loaded'
          print('STATIC PASS',len(ids),'unique ids')
          PY

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Exercise live staging UI without page.evaluate
        shell: bash
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const URL='https://kaseys-binder-studio-staging.jin345.workers.dev';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await ctx.newPage();
            const errors=[];
            const failed=[];
            const responses=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));
            page.on('response',r=>{
              const u=r.url();
              if(/cdn\.donmai\.us|raw\.githubusercontent\.com|pokeapi\.co|art-cache|tcgdex\.net|\/api\/config/.test(u)){
                responses.push({url:u,status:r.status(),ct:r.headers()['content-type']||''});
              }
            });

            await page.goto(URL,{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1800);
            const version=(await page.locator('#versionLink').textContent())||'';
            console.log('VERSION',version);
            if(!/2\.8\.0/.test(version))throw new Error('Expected v2.8.0 staging shell');
            if(await page.locator('#catalogFilter').count())throw new Error('Catalog selector should be removed');
            for(const s of ['#libraryCardsTab','#libraryArtworkTab','#setFilter','#artistFilter','#openBinders']){
              if(await page.locator(s).count()!==1)throw new Error('Missing UI '+s);
            }

            await page.click('#openBinders');
            await page.waitForTimeout(400);
            const aria=await page.locator('#binderModal').getAttribute('aria-hidden');
            console.log('BINDER_ARIA_HIDDEN',aria);
            if(aria!=='false')throw new Error('Binder modal did not open');
            await page.click('#closeBinders');

            await page.fill('#subject','eevee');
            await page.click('#searchBtn');
            await page.click('#libraryArtworkTab');
            await page.waitForTimeout(10000);
            const artCards=await page.locator('#autoArtworkResults .auto-art-card').count();
            const artImgs=await page.locator('#autoArtworkResults img').count();
            const artStatus=(await page.locator('#autoArtworkStatus').textContent())||'';
            const srcs=[];
            for(let i=0;i<Math.min(artImgs,8);i++)srcs.push(await page.locator('#autoArtworkResults img').nth(i).getAttribute('src'));
            const artResponses=responses.filter(x=>/cdn\.donmai\.us|raw\.githubusercontent\.com\/PokeAPI/.test(x.url));
            const goodImages=artResponses.filter(x=>x.status===200&&String(x.ct).startsWith('image/'));
            const artFailed=failed.filter(x=>/cdn\.donmai\.us|raw\.githubusercontent\.com\/PokeAPI/.test(x.url));
            console.log('ARTWORK',{artCards,artImgs,artStatus,srcs,goodImageResponses:goodImages.length,failedImageRequests:artFailed.length});
            console.log('ART_IMAGE_RESPONSES',JSON.stringify(artResponses.slice(0,30),null,2));
            console.log('ART_IMAGE_FAILED',JSON.stringify(artFailed.slice(0,30),null,2));
            if(artCards<10)throw new Error('Expected >=10 artwork cards, got '+artCards);
            if(goodImages<10)throw new Error('Artwork image network responses did not validate: '+goodImages.length+' good image responses');

            const before=artCards;
            const moreDisabled=await page.isDisabled('#autoArtworkLoadMore');
            if(!moreDisabled){
              await page.click('#autoArtworkLoadMore');
              await page.waitForTimeout(2500);
              const after=await page.locator('#autoArtworkResults .auto-art-card').count();
              console.log('ARTWORK_MORE',before,'->',after);
              if(after<=before)throw new Error('Artwork More did not append results');
            }

            await page.click('#libraryCardsTab');
            await page.waitForTimeout(1000);
            console.log('CARD_RESULTS',await page.locator('#cards .card-item').count());

            await page.click('#syncMasterLibrary',{force:true});
            await page.waitForTimeout(18000);
            const libStatus=(await page.locator('#masterLibraryStatus').textContent())||'';
            const libProgress=(await page.locator('#libraryProgressText').textContent())||'';
            const bannerHidden=await page.locator('#runtimeErrorBanner').getAttribute('hidden');
            const bannerText=(await page.locator('#runtimeErrorText').textContent())||'';
            console.log('LIBRARY',{libStatus,libProgress,bannerHidden,bannerText});
            if(bannerHidden===null)throw new Error('App notice appeared during library build: '+bannerText);
            if(!/Building|Library|catalog|ready/i.test(libStatus+' '+libProgress))throw new Error('Library build did not start/progress');

            await page.click('#mobilePreviewToggle');
            await page.waitForTimeout(500);
            for(const s of ['#mobileLabBottomNav','[data-mobile-lab="art"]','[data-mobile-lab="page"]']){
              if(await page.locator(s).count()!==1)throw new Error('Mobile UI missing '+s);
            }

            const configResp=await page.request.get(URL+'/api/config');
            console.log('AUTH_CONFIG',configResp.status());
            if(!configResp.ok())throw new Error('/api/config failed');

            console.log('FAILED_REQUESTS',JSON.stringify(failed.slice(0,40),null,2));
            console.log('CONSOLE_ERRORS',JSON.stringify(errors.slice(0,40),null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
