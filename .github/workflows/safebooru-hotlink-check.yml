name: Safebooru Hotlink Check
on:
  push:
    branches: [staging-ui-auth-test]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0 pngjs@7 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Render known Safebooru image from staging origin
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const {PNG}=require('pngjs');
          const fs=require('fs');
          const ORIGIN='https://kaseys-binder-studio-staging.jin345.workers.dev';
          const IMG='https://safebooru.org/images/4429/8a6e08572f37ad688b4372f1e8e1ac3587936683.jpg';
          function variance(path){const p=PNG.sync.read(fs.readFileSync(path));let n=0,sum=0,sum2=0;for(let y=5;y<p.height-5;y+=2)for(let x=5;x<p.width-5;x+=2){const i=(y*p.width+x)*4;if(p.data[i+3]<30)continue;const v=.2126*p.data[i]+.7152*p.data[i+1]+.0722*p.data[i+2];n++;sum+=v;sum2+=v*v}const m=sum/Math.max(1,n);return Math.sqrt(Math.max(0,sum2/Math.max(1,n)-m*m));}
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:500,height:500}});const responses=[];p.on('response',r=>{if(r.url()===IMG)responses.push({status:r.status(),ct:r.headers()['content-type']||''})});p.on('requestfailed',r=>{if(r.url()===IMG)console.log('FAILED',r.failure())});await p.goto(ORIGIN,{waitUntil:'domcontentloaded',timeout:60000});await p.setContent(`<style>html,body{margin:0;background:#111}img{display:block;width:360px;height:360px;object-fit:contain}</style><img id="art" src="${IMG}">`,{waitUntil:'networkidle',timeout:60000});await p.waitForTimeout(2500);console.log('RESPONSES',responses);if(!responses.some(x=>x.status===200&&x.ct.startsWith('image/')))throw new Error('Safebooru image did not return 200 image/*');await p.locator('#art').screenshot({path:'safe.png'});const v=variance('safe.png');console.log('PIXEL_VARIANCE',v);if(v<=8)throw new Error('Safebooru image rendered blank');await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
