name: Temporary Art Tray Sanity

on:
  push:
    branches: [staging-ui-auth-test]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify live Art Tray through normal UI flow
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const URL='https://kaseys-binder-studio-staging.jin345.workers.dev/?arttrayqa='+Date.now();
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto(URL,{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1800);
            await page.click('#libraryArtworkTab');
            await page.fill('#artSearchQuery','Gardevoir');
            await page.click('#artSearchSubmit');
            await page.waitForSelector('#autoArtworkResults .auto-art-card .auto-art-add',{state:'visible',timeout:15000});
            await page.locator('#autoArtworkResults .auto-art-card .auto-art-add').first().click();
            const pane=page.locator('.artwork-pane');
            const tray=page.locator('#arts');
            const item=page.locator('#arts .item').first();
            const size=page.locator('#arts .item .art-size').first();
            await size.waitFor({state:'visible',timeout:8000});
            const [paneBox,trayBox,itemBox,sizeBox]=await Promise.all([pane.boundingBox(),tray.boundingBox(),item.boundingBox(),size.boundingBox()]);
            const before=await size.inputValue();
            console.log('ART_TRAY_METRICS',JSON.stringify({paneBox,trayBox,itemBox,sizeBox,before}));
            console.log('PAGE_ERRORS',JSON.stringify(errors));
            if(!paneBox||!trayBox||trayBox.height<200)throw new Error('Art Tray collapsed: '+JSON.stringify({paneBox,trayBox}));
            if(trayBox.y<paneBox.y||trayBox.y+trayBox.height>paneBox.y+paneBox.height+2)throw new Error('Art Tray is outside Artwork pane: '+JSON.stringify({paneBox,trayBox}));
            if(!itemBox||itemBox.height<60)throw new Error('Artwork card is not visible: '+JSON.stringify(itemBox));
            if(!sizeBox||sizeBox.height<20||sizeBox.width<40)throw new Error('Art size selector is not usable: '+JSON.stringify(sizeBox));
            if(sizeBox.y<trayBox.y||sizeBox.y+sizeBox.height>trayBox.y+trayBox.height)throw new Error('Art size selector is outside Art Tray');
            await size.selectOption('3x1');
            const changed=await size.inputValue();
            if(changed!=='3x1')throw new Error('Art size selector did not change');
            if(errors.length)throw new Error('Runtime errors: '+errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
