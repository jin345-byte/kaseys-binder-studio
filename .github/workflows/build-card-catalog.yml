name: Build Unified Card Catalog

on:
  workflow_dispatch:
  push:
    branches: [staging-ui-auth-test]
    paths:
      - 'scripts/build-unified-catalog.mjs'
      - '.github/workflows/build-card-catalog.yml'
      - 'public/features/prebuilt-catalog-bootstrap.js'
  schedule:
    # Run at both UTC offsets that can correspond to 8:00 AM America/New_York.
    # A local-time gate below allows only the actual 8 AM run to continue.
    - cron: '0 12,13 * * *'

permissions:
  contents: write

concurrency:
  group: binder-studio-unified-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-ui-auth-test
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check morning schedule
        id: gate
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=America/New_York date +%H)"
          if [[ "$hour" == "08" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate DST cron; New York hour is $hour"
          fi

      - name: Build unified English + Pocket catalog
        if: steps.gate.outputs.run == 'true'
        run: node scripts/build-unified-catalog.mjs

      - name: Read build result
        if: steps.gate.outputs.run == 'true'
        id: result
        shell: bash
        run: |
          changed="$(node -p "require('./catalog-build-result.json').changed ? 'true' : 'false'")"
          version="$(node -p "require('./catalog-build-result.json').version")"
          cards="$(node -p "require('./catalog-build-result.json').cards")"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cards=$cards" >> "$GITHUB_OUTPUT"
          echo "Catalog $version · $cards cards · changed=$changed"

      - name: Validate generated catalog
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('public/catalog/manifest.json','utf8'));
          if(m.cards<15500)throw new Error('Catalog card count too low');
          if(m.english<15000)throw new Error('English card count too low');
          if(m.pocket<500)throw new Error('Pocket card count too low');
          let total=0;
          for(const c of m.chunks){
            const rows=JSON.parse(fs.readFileSync('public/catalog/'+c.file,'utf8'));
            if(rows.length!==c.count)throw new Error('Chunk count mismatch '+c.file);
            total+=rows.length;
          }
          if(total!==m.cards)throw new Error(`Manifest total mismatch ${total}/${m.cards}`);
          console.log(`VALID ${m.cards} cards · ${m.chunks.length} chunks · ${m.version}`);
          JS

      - name: Commit catalog snapshot
        if: steps.gate.outputs.run == 'true' && steps.result.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "Binder Studio Catalog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/catalog
          git commit -m "Update unified card catalog ${{ steps.result.outputs.version }}"
          git push origin HEAD:staging-ui-auth-test

      - name: Deploy catalog to staging Cloudflare
        if: steps.gate.outputs.run == 'true' && (steps.result.outputs.changed == 'true' || github.event_name != 'schedule')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          git fetch origin staging-ui-auth-test
          git reset --hard origin/staging-ui-auth-test
          npm install --no-save wrangler@4 >/dev/null 2>&1
          npx wrangler deploy --config=wrangler.staging.jsonc

      - name: Smoke-test deployed manifest
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          node <<'JS'
          (async()=>{
            const expected=require('./public/catalog/manifest.json');
            const base='https://kaseys-binder-studio-staging.jin345.workers.dev/catalog/manifest.json';
            let last='';
            for(let attempt=1;attempt<=12;attempt++){
              try{
                const r=await fetch(base+'?t='+Date.now(),{cache:'no-store'});
                if(!r.ok){last='HTTP '+r.status;throw new Error(last)}
                const m=await r.json();
                if(m.version===expected.version&&m.cards===expected.cards){
                  console.log(`DEPLOYED ${m.version} · ${m.cards} cards · attempt ${attempt}`);
                  return;
                }
                last=`got ${m.version}/${m.cards}, expected ${expected.version}/${expected.cards}`;
              }catch(e){last=e.message||String(e)}
              console.log(`Waiting for Cloudflare propagation (${attempt}/12): ${last}`);
              await new Promise(r=>setTimeout(r,5000));
            }
            throw new Error('Catalog did not propagate: '+last);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: No catalog changes
        if: steps.gate.outputs.run == 'true' && steps.result.outputs.changed == 'false'
        run: echo "Unified card data is unchanged; the existing catalog version remains current."
