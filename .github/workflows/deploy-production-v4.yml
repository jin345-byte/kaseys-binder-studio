name: Deploy Production V4

on:
  push:
    branches:
      - production-d1-backup-2026-09-21

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy full glimmer Binder Studio logo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify approved glimmer-logo revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c8ad3a2d12f500eceac53f1a43001250d0887009"
          grep -q 'kaseys-binder-studio-db' wrangler.jsonc
          grep -q 'ea5aaa71-88e3-4bff-b997-7aa9bff3c24d' wrangler.jsonc
          node --check src/worker.js
          node --check public/features/mobile-lab.js
          grep -q 'branding/kaseys-binder-studio-logo.svg?v=3' public/features/mobile-lab.js
          grep -q 'viewBox="0 0 1800 300"' public/branding/kaseys-binder-studio-logo.svg
          grep -q 'Binder Studio</text>' public/branding/kaseys-binder-studio-logo.svg
          grep -q '<animate attributeName="opacity"' public/branding/kaseys-binder-studio-logo.svg
          grep -q 'syncVersion:2' src/worker.js
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy production Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config=wrangler.jsonc
      - name: Verify production glimmer logo
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaseys-binder-studio.jin345.workers.dev'
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsS "$BASE/api/config" || true)"
            MOBILE="$(curl -fsS "$BASE/features/mobile-lab.js" || true)"
            LOGO="$(curl -fsS "$BASE/branding/kaseys-binder-studio-logo.svg?v=3" || true)"
            if echo "$BODY" | grep -q '"syncVersion":2' && echo "$MOBILE" | grep -q 'logo.svg?v=3' && echo "$LOGO" | grep -q 'viewBox="0 0 1800 300"' && echo "$LOGO" | grep -q 'Binder Studio</text>' && echo "$LOGO" | grep -q '<animate attributeName="opacity"'; then
              echo 'Production full glimmer logo verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Production verification failed.'
          exit 1
