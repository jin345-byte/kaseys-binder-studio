name: Deploy Production V4

on:
  push:
    branches:
      - production-d1-backup-2026-09-21

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy logo spacing fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify approved logo spacing revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "31588adbf6587646dc1f6f2f3fb94ccd00de3726"
          grep -q 'kaseys-binder-studio-db' wrangler.jsonc
          grep -q 'ea5aaa71-88e3-4bff-b997-7aa9bff3c24d' wrangler.jsonc
          node --check src/worker.js
          node --check public/features/mobile-lab.js
          grep -q 'logo.svg?v=4' public/features/mobile-lab.js
          grep -q 'viewBox="0 0 1840 300"' public/branding/kaseys-binder-studio-logo.svg
          grep -q '<text x="805" y="183"' public/branding/kaseys-binder-studio-logo.svg
          grep -q 'syncVersion:2' src/worker.js
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy production Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config=wrangler.jsonc
      - name: Verify production logo spacing fix
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaseys-binder-studio.jin345.workers.dev'
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsS "$BASE/api/config" || true)"
            MOBILE="$(curl -fsS "$BASE/features/mobile-lab.js" || true)"
            LOGO="$(curl -fsS "$BASE/branding/kaseys-binder-studio-logo.svg?v=4" || true)"
            if echo "$BODY" | grep -q '"syncVersion":2' && echo "$MOBILE" | grep -q 'logo.svg?v=4' && echo "$LOGO" | grep -q 'viewBox="0 0 1840 300"' && echo "$LOGO" | grep -q '<text x="805" y="183"'; then
              echo 'Production logo spacing verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Production verification failed.'
          exit 1
