name: Deploy Production V4

on:
  push:
    branches:
      - production-d1-backup-2026-09-21

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy v4 production from approved release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify approved release revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "89e159d25644f3e1ac793eab060ae7f9f9335063"
          grep -q 'kaseys-binder-studio-db' wrangler.jsonc
          grep -q 'ea5aaa71-88e3-4bff-b997-7aa9bff3c24d' wrangler.jsonc
          test ! -e wrangler.release-candidate.jsonc
          test ! -e public/features/compat-fixture-test.js
          node --check src/worker.js
          node --check public/features/cloud-sync.js
          node --check public/features/production-v4.js
          grep -q 'syncVersion:2' src/worker.js
          grep -q 'cloudSyncVersion:2' public/features/production-v4.js
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy production Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config=wrangler.jsonc
      - name: Verify production API
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaseys-binder-studio.jin345.workers.dev'
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsS "$BASE/api/config" || true)"
            if echo "$BODY" | grep -q '"syncVersion":2'; then
              echo "$BODY"
              exit 0
            fi
            sleep 5
          done
          echo 'Production API did not report syncVersion 2.'
          exit 1
