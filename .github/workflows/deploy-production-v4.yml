name: Deploy Production V4

on:
  push:
    branches:
      - production-d1-backup-2026-09-21

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy Lavender-only production theme'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify approved Lavender-only revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "191cecb9d7507180480a17b0ae9ecf35f8f0505f"
          grep -q 'kaseys-binder-studio-db' wrangler.jsonc
          grep -q 'ea5aaa71-88e3-4bff-b997-7aa9bff3c24d' wrangler.jsonc
          test -e public/features/lavender-only.js
          node --check src/worker.js
          node --check public/features/cloud-sync.js
          node --check public/features/production-v4.js
          node --check public/features/lavender-only.js
          grep -q 'syncVersion:2' src/worker.js
          grep -q 'themeLocked:true' public/features/production-v4.js
          grep -q "theme:'lavender'" public/features/production-v4.js
          grep -q 'body data-theme="lavender"' public/index.html
          ! grep -q "features/full-themes.js" public/features/production-v4.js
          ! grep -q "features/theme-picker-fit.js" public/features/production-v4.js
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy production Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config=wrangler.jsonc
      - name: Verify production API and Lavender lock
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaseys-binder-studio.jin345.workers.dev'
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsS "$BASE/api/config" || true)"
            INDEX="$(curl -fsS "$BASE/" || true)"
            LOADER="$(curl -fsS "$BASE/features/production-v4.js" || true)"
            LOCK="$(curl -fsS "$BASE/features/lavender-only.js" || true)"
            if echo "$BODY" | grep -q '"syncVersion":2' && echo "$INDEX" | grep -q 'body data-theme="lavender"' && echo "$LOADER" | grep -q 'themeLocked:true' && echo "$LOCK" | grep -q "const THEME='lavender'"; then
              echo 'Production Lavender-only theme verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Production verification failed.'
          exit 1
