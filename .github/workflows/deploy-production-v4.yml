name: Deploy Production V4

on:
  push:
    branches:
      - production-d1-backup-2026-09-21

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy production startup performance hotfix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify approved hotfix revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5f65922571b880c91b2a92c8fe0991a4d66dcb5e"
          grep -q 'kaseys-binder-studio-db' wrangler.jsonc
          grep -q 'ea5aaa71-88e3-4bff-b997-7aa9bff3c24d' wrangler.jsonc
          test -e public/catalog/manifest.json
          test -e public/catalog/cards-008.json
          test -e public/features/prebuilt-catalog-bootstrap.js
          node --check src/worker.js
          node --check public/features/cloud-sync.js
          node --check public/features/production-v4.js
          node --check public/features/prebuilt-catalog-bootstrap.js
          grep -q 'syncVersion:2' src/worker.js
          grep -q 'startupFastPath:true' public/features/production-v4.js
          grep -q '4.0.6-hotfix2' public/features/production-v4.js
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy production Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config=wrangler.jsonc
      - name: Verify production API and hotfix assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaseys-binder-studio.jin345.workers.dev'
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsS "$BASE/api/config" || true)"
            LOADER="$(curl -fsS "$BASE/features/production-v4.js" || true)"
            BOOTSTRAP="$(curl -fsS "$BASE/features/prebuilt-catalog-bootstrap.js" || true)"
            if echo "$BODY" | grep -q '"syncVersion":2' && echo "$LOADER" | grep -q '4.0.6-hotfix2' && echo "$LOADER" | grep -q 'startupFastPath:true' && echo "$BOOTSTRAP" | grep -q 'inspectMaster'; then
              echo 'Production startup hotfix verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Production verification failed.'
          exit 1
