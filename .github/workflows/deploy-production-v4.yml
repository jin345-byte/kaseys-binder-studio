name: Deploy Production V4

on:
  push:
    branches:
      - production-d1-backup-2026-09-21

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy mobile action cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify approved mobile-action cleanup revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6cc19a3a4bec060ad794c8912f2a06d82a11f3c1"
          grep -q 'kaseys-binder-studio-db' wrangler.jsonc
          grep -q 'ea5aaa71-88e3-4bff-b997-7aa9bff3c24d' wrangler.jsonc
          node --check src/worker.js
          node --check public/features/mobile-lab.js
          grep -q "mobilePageActions')?.remove" public/features/mobile-lab.js
          grep -q "mobileLabBottomNav')?.remove" public/features/mobile-lab.js
          grep -q 'syncVersion:2' src/worker.js
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy production Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config=wrangler.jsonc
      - name: Verify production mobile action cleanup
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaseys-binder-studio.jin345.workers.dev'
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsS "$BASE/api/config" || true)"
            MOBILE="$(curl -fsS "$BASE/features/mobile-lab.js" || true)"
            if echo "$BODY" | grep -q '"syncVersion":2' && echo "$MOBILE" | grep -q "mobilePageActions')?.remove" && echo "$MOBILE" | grep -q "mobileLabBottomNav')?.remove"; then
              echo 'Production obsolete mobile actions removed.'
              exit 0
            fi
            sleep 5
          done
          echo 'Production verification failed.'
          exit 1
