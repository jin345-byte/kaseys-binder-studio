name: Deploy Production V4

on:
  push:
    branches:
      - production-d1-backup-2026-09-21

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy binder cover Art of Pokemon hotfix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify approved binder-cover hotfix revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "decab56fbff49dda8a78701890a4b497c0dc0357"
          grep -q 'kaseys-binder-studio-db' wrangler.jsonc
          grep -q 'ea5aaa71-88e3-4bff-b997-7aa9bff3c24d' wrangler.jsonc
          node --check src/worker.js
          node --check public/features/production-v405.js
          node --check public/features/binder-cover-artofpkm-fix.js
          grep -q 'binder-cover-artofpkm-fix.js' public/features/production-v405.js
          grep -q 'cdn.artofpkm.com' public/features/binder-cover-artofpkm-fix.js
          grep -q '/api/art-image?url=' public/features/binder-cover-artofpkm-fix.js
          grep -q 'SAFE_PREVIEW_GET_APIS' src/worker.js
          grep -q "'/api/art-image'" src/worker.js
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy production Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config=wrangler.jsonc
      - name: Verify production binder-cover Art of Pokemon proxy hotfix
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaseys-binder-studio.jin345.workers.dev'
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsS "$BASE/api/config" || true)"
            LOADER="$(curl -fsS "$BASE/features/production-v405.js" || true)"
            FIX="$(curl -fsS "$BASE/features/binder-cover-artofpkm-fix.js" || true)"
            if echo "$BODY" | grep -q '"syncVersion":2' && echo "$LOADER" | grep -q 'binder-cover-artofpkm-fix.js' && echo "$FIX" | grep -q 'cdn.artofpkm.com' && echo "$FIX" | grep -q '/api/art-image?url='; then
              echo 'Binder-cover Art of Pokemon proxy hotfix verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Production verification failed.'
          exit 1
