name: Full Themes Preview Check

on:
  push:
    branches: [prod-db-compat-preview]
    paths:
      - 'public/styles/full-themes.css'
      - 'public/styles/theme-layout-lock.css'
      - 'public/styles/theme-branding.css'
      - 'public/styles/typography-picker.css'
      - 'public/features/full-themes.js'
      - 'public/features/typography-picker.js'
      - 'public/features/staging-v287.js'
      - '.github/workflows/full-themes-preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-full-themes-preview
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static theme checks
        run: |
          node --check public/features/full-themes.js
          node --check public/features/typography-picker.js
          node --check public/features/staging-v287.js
          for theme in pokedex game-boy neo-genesis team-rocket lavender cyberpunk cozy-sakura dark-academia e-ink retro-card-shop; do grep -q "body\[data-theme=\"$theme\"\]" public/styles/full-themes.css; done
          grep -q 'kbsThemeLayoutLockStyle' public/features/full-themes.js
          grep -q "DEFAULT_THEME='lavender'" public/features/full-themes.js
          grep -q 'Theme switching should be visual only' public/styles/theme-layout-lock.css
          test ! -e public/styles/theme-font-unified.css
          test ! -e public/styles/theme-animated-accents.css
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify deployed static theme picker, geometry and persistence
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const expected=['jolteon','pokedex','game-boy','neo-genesis','team-rocket','lavender','cyberpunk','cozy-sakura','dark-academia','e-ink','retro-card-shop'];
          (async()=>{
            let live=false;for(let i=0;i<60;i++){const js=await fetch(BASE+'/features/full-themes.js?qa='+Date.now(),{cache:'no-store'}).catch(()=>null),t=js?.ok?await js.text():'';if(t.includes("DEFAULT_THEME='lavender'")&&t.includes('theme-branding.css?v=4.0.5')){live=true;break}await sleep(5000)}if(!live)throw new Error('Static theme assets did not propagate');
            const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1100}});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(BASE+'/?themesqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});await page.waitForSelector('#fullThemeSelect',{timeout:30000});
            const initial=await page.evaluate(()=>({theme:document.body.dataset.theme,font:document.body.dataset.kbsFont,options:[...document.querySelector('#fullThemeSelect').options].map(o=>o.value),colors:['#binderColor','#pageColor','#sleeveColor'].filter(s=>document.querySelector(s)).length,themeApi:typeof KBSFullThemes==='object'}));
            if(initial.theme!=='lavender'||initial.font!=='system')throw new Error('New-session defaults mismatch '+JSON.stringify(initial));if(JSON.stringify(initial.options)!==JSON.stringify(expected))throw new Error('Theme options mismatch');if(initial.colors!==3||!initial.themeApi)throw new Error('Appearance controls/theme API mismatch');
            const measure=()=>page.evaluate(()=>{const pick=sel=>{const el=[...document.querySelectorAll(sel)].find(x=>{const s=getComputedStyle(x),r=x.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0});if(!el)return null;const r=el.getBoundingClientRect(),s=getComputedStyle(el);return{left:r.left,top:r.top,width:r.width,height:r.height,radius:s.borderRadius,font:s.fontFamily,fontSize:s.fontSize,padding:s.padding}};return{panel:pick('.panel'),button:pick('.btn'),browser:pick('.browser-pane'),appearance:pick('.appearance-module'),themeControl:pick('.full-theme-control'),themeSelect:pick('#fullThemeSelect')}});
            const same=(a,b,label)=>{if(!a||!b)return;for(const k of ['left','top','width','height'])if(Math.abs(a[k]-b[k])>1)throw new Error(`${label}.${k} moved/resized ${a[k]} -> ${b[k]}`);for(const k of ['radius','font','fontSize','padding'])if(a[k]!==b[k])throw new Error(`${label}.${k} changed ${a[k]} -> ${b[k]}`)};
            await page.evaluate(()=>KBSFullThemes.apply('lavender',{persist:false,applyPalette:false}));const baseline=await measure(),snapshots=[];
            for(const id of expected){await page.evaluate(id=>KBSFullThemes.apply(id,{persist:true,applyPalette:false}),id);await page.waitForFunction(x=>document.body.dataset.theme===x,id);await page.waitForTimeout(30);const geometry=await measure();for(const key of Object.keys(baseline))same(baseline[key],geometry[key],`${id}:${key}`);snapshots.push(await page.evaluate(()=>{const cs=getComputedStyle(document.body),grid=getComputedStyle(document.querySelector('#grid'));return{id:document.body.dataset.theme,accent:cs.getPropertyValue('--accent').trim(),font:cs.fontFamily,gridBackground:grid.backgroundImage,stored:JSON.parse(localStorage.getItem('michiStandaloneState')||'{}').theme||''}}))}
            if(snapshots.some(x=>!x.accent||!x.gridBackground||x.stored!==x.id))throw new Error('Theme application/persistence failed '+JSON.stringify(snapshots));if(new Set(snapshots.map(x=>x.accent)).size<8)throw new Error('Themes are not visually distinct enough');
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});await page.waitForSelector('#fullThemeSelect',{timeout:30000});await page.waitForFunction(()=>document.body.dataset.theme==='retro-card-shop');if(await page.$eval('#fullThemeSelect',el=>el.value)!=='retro-card-shop')throw new Error('Theme did not survive reload');if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));await browser.close();console.log('FULL_THEMES_STATIC_PASS',JSON.stringify({count:expected.length}));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
