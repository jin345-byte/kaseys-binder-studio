name: Full UI Visual Audit

on:
  push:
    branches: [prod-db-compat-preview]
    paths:
      - 'public/**'
      - '.github/workflows/full-ui-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-full-ui-visual-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Audit every app surface, theme, and viewport
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const viewports=[
            {name:'desktop',width:1440,height:1000},
            {name:'tablet',width:900,height:900},
            {name:'mobile',width:390,height:844},
          ];
          const expectedThemes=['jolteon','pokedex','game-boy','neo-genesis','team-rocket','lavender','cyberpunk','cozy-sakura','dark-academia','e-ink','retro-card-shop'];
          const rgba=s=>{const m=String(s||'').match(/rgba?\(([^)]+)\)/);if(!m)return null;const p=m[1].split(',').map(x=>Number.parseFloat(x));return {r:p[0],g:p[1],b:p[2],a:p.length>3?p[3]:1}};
          const lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4};return .2126*f(c.r)+.7152*f(c.g)+.0722*f(c.b)};
          const contrast=(a,b)=>{const l1=lum(a),l2=lum(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)};

          (async()=>{
            let live=false;
            for(let i=0;i<48;i++){
              const stamp=Date.now();
              const [loaderRes,cssRes]=await Promise.all([
                fetch(BASE+'/features/staging-v287.js?uiaudit='+stamp,{cache:'no-store'}).catch(()=>null),
                fetch(BASE+'/styles/ui-readability-fixes.css?uiaudit='+stamp,{cache:'no-store'}).catch(()=>null),
              ]);
              const [loader,css]=await Promise.all([
                loaderRes?.ok?loaderRes.text().catch(()=>''):'',
                cssRes?.ok?cssRes.text().catch(()=>''):'',
              ]);
              if(loader.includes('ui-readability-fixes.css?v=3.5.4') && css.includes("v3.5.4") && css.includes('grid-template-columns:repeat(2,minmax(0,1fr))')){live=true;break}
              await sleep(5000);
            }
            if(!live)throw new Error('Latest v3.5.4 preview assets did not propagate');

            const browser=await chromium.launch({headless:true});
            const findings=[];
            const pageErrors=[];
            let auditedButtons=0;
            let auditedStates=0;

            for(const vp of viewports){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              page.on('pageerror',e=>pageErrors.push(`${vp.name}: ${e.message}`));
              page.on('console',m=>{if(m.type()==='error')pageErrors.push(`${vp.name} console: ${m.text()}`)});
              await page.goto(BASE+'/?focus=3.3.2&fulluiaudit='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('#searchBtn',{timeout:30000});
              await page.waitForFunction(()=>[...document.styleSheets].some(s=>String(s.href||'').includes('ui-readability-fixes.css?v=3.5.4')),{timeout:20000});
              await page.waitForTimeout(800);

              const auditState=async(label)=>{
                auditedStates++;
                const rows=await page.evaluate(()=>{
                  const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)>0.05&&r.width>2&&r.height>2};
                  const nearestBg=e=>{let n=e;while(n){const s=getComputedStyle(n);const bg=s.backgroundColor;if(bg&&bg!=='transparent'&&!/rgba\([^)]*,\s*0(?:\.0+)?\)/.test(bg))return bg;n=n.parentElement}return getComputedStyle(document.body).backgroundColor};
                  return [...document.querySelectorAll('button,.btn,[role="button"],label.btn,.artlink,.library-build-cta,.page-arrow,.page-number,.version-link,.auto-artwork-more,.mobile-lab-nav-btn,.library-browser-tab')].filter(visible).map(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return {id:e.id||'',text:(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim(),color:s.color,bg:s.backgroundColor,bgImage:s.backgroundImage,fontSize:parseFloat(s.fontSize)||0,fontWeight:s.fontWeight,width:r.width,height:r.height,clientWidth:e.clientWidth,scrollWidth:e.scrollWidth,clientHeight:e.clientHeight,scrollHeight:e.scrollHeight,whiteSpace:s.whiteSpace,overflow:s.overflow,nearestBg:nearestBg(e)}});
                });
                auditedButtons+=rows.length;
                for(const b of rows){
                  if(!b.text)continue;
                  const fg=rgba(b.color),own=rgba(b.bg),bg=rgba((b.bg&&own?.a>0.05)?b.bg:b.nearestBg);
                  if(fg&&bg&&b.bgImage==='none'){
                    const cr=contrast(fg,bg),large=b.fontSize>=18||(b.fontSize>=14&&Number.parseInt(b.fontWeight)>=700),min=large?3:4.5;
                    if(cr<min)findings.push({kind:'low-contrast',vp:vp.name,state:label,id:b.id,text:b.text.slice(0,60),ratio:+cr.toFixed(2)});
                  }
                  const clippedX=b.scrollWidth>b.clientWidth+3&&!['normal','pre-wrap','pre-line'].includes(b.whiteSpace);
                  const clippedY=b.scrollHeight>b.clientHeight+3&&b.overflow!=='visible';
                  if(clippedX||clippedY)findings.push({kind:'clipped-text',vp:vp.name,state:label,id:b.id,text:b.text.slice(0,60),box:[Math.round(b.width),Math.round(b.height)],scroll:[b.scrollWidth,b.scrollHeight]});
                  if(b.height<32||b.width<28)findings.push({kind:'tiny-control',vp:vp.name,state:label,id:b.id,text:b.text.slice(0,60),box:[Math.round(b.width),Math.round(b.height)]});
                }
              };

              const themes=await page.evaluate(()=>window.KBSFullThemes?.list?.().map(x=>x.id)||[]);
              for(const t of expectedThemes){
                if(!themes.includes(t)){findings.push({kind:'missing-theme',vp:vp.name,theme:t});continue}
                await page.evaluate(id=>window.KBSFullThemes.apply(id,{persist:false,applyPalette:false}),t);
                await page.waitForTimeout(60);
                await auditState(`main:${t}`);
              }

              await page.click('#libraryArtworkTab').catch(()=>{});await auditState('artwork-tab');
              await page.click('#libraryCardsTab').catch(()=>{});await auditState('cards-tab');

              const openBinders=page.locator('#openBinders');
              if(await openBinders.isVisible().catch(()=>false))await openBinders.click();
              else await page.locator('#mobilePageBinders').click().catch(()=>{});
              await page.waitForTimeout(150);
              await auditState('my-binders');
              const binderCheck=await page.evaluate(()=>{
                const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};
                const buttons=[...document.querySelectorAll('.page-card-actions button')].filter(vis);
                return {buttons:buttons.map(b=>({text:b.textContent.trim(),w:b.getBoundingClientRect().width,h:b.getBoundingClientRect().height,sw:b.scrollWidth,cw:b.clientWidth,fs:parseFloat(getComputedStyle(b).fontSize)})),toolbar:[...document.querySelectorAll('.binder-toolbar button')].filter(vis).map(b=>({text:b.textContent.trim(),h:b.getBoundingClientRect().height,fs:parseFloat(getComputedStyle(b).fontSize)}))};
              });
              for(const b of binderCheck.buttons){
                if(b.sw>b.cw+3)findings.push({kind:'binder-action-clipped',vp:vp.name,...b});
                if(b.fs<11)findings.push({kind:'binder-action-small-text',vp:vp.name,...b});
                if(vp.name==='mobile'&&b.h<44)findings.push({kind:'binder-action-small-touch',vp:vp.name,...b});
              }
              for(const b of binderCheck.toolbar){if(b.fs<11)findings.push({kind:'binder-toolbar-small-text',vp:vp.name,...b})}
              await page.locator('#closeBinders').click().catch(()=>{});

              await page.locator('#versionLink').click().catch(()=>{});await page.waitForTimeout(80);await auditState('build-info');await page.locator('#buildInfoClose').click().catch(()=>{});
              await page.locator('#guidedTourLaunch').click().catch(()=>{});await page.waitForTimeout(100);await auditState('guided-tour');
              await page.evaluate(()=>{const d=document.querySelector('#guidedDemo');if(d){d.hidden=true;d.setAttribute('aria-hidden','true')}});

              if(vp.name==='mobile')for(const sel of ['[data-mobile-lab="cards"]','[data-mobile-lab="page"]','[data-mobile-lab="art"]']){await page.locator(sel).click().catch(()=>{});await page.waitForTimeout(60);await auditState(sel)}
              await page.close();
            }

            await browser.close();
            const seriousKinds=new Set(['low-contrast','clipped-text','missing-theme','binder-action-clipped','binder-action-small-text','binder-action-small-touch','binder-toolbar-small-text']);
            const serious=findings.filter(x=>seriousKinds.has(x.kind));
            console.log('FULL_UI_AUDIT_SUMMARY',JSON.stringify({auditedButtons,auditedStates,findings:findings.length,serious:serious.length,pageErrors:pageErrors.length}));
            if(findings.length)console.log('FULL_UI_AUDIT_FINDINGS',JSON.stringify(findings,null,2));
            if(pageErrors.length)console.log('FULL_UI_PAGE_ERRORS',JSON.stringify(pageErrors,null,2));
            if(serious.length||pageErrors.length)process.exit(1);
            console.log('FULL_UI_AUDIT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
