name: Full UI Visual Audit

on:
  push:
    branches: [prod-db-compat-preview]
    paths:
      - 'public/**'
      - '.github/workflows/full-ui-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-full-ui-visual-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Audit every app surface, theme, font, and viewport
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const viewports=[{name:'desktop',width:1440,height:1000},{name:'tablet',width:900,height:900},{name:'mobile',width:390,height:844}];
          const expectedThemes=['jolteon','pokedex','game-boy','neo-genesis','team-rocket','lavender','cyberpunk','cozy-sakura','dark-academia','e-ink','retro-card-shop'];
          const expectedFonts=['system','verdana','trebuchet','georgia'];
          const rgba=s=>{const m=String(s||'').match(/rgba?\(([^)]+)\)/);if(!m)return null;const p=m[1].split(',').map(x=>Number.parseFloat(x));return{r:p[0],g:p[1],b:p[2],a:p.length>3?p[3]:1}};
          const lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4};return .2126*f(c.r)+.7152*f(c.g)+.0722*f(c.b)};
          const contrast=(a,b)=>{const l1=lum(a),l2=lum(b);return(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)};
          (async()=>{
            let live=false;for(let i=0;i<60;i++){const s=Date.now();const [loaderRes,flowRes]=await Promise.all([fetch(BASE+'/features/staging-v287.js?uiaudit='+s,{cache:'no-store'}).catch(()=>null),fetch(BASE+'/styles/ui-flow-polish.css?uiaudit='+s,{cache:'no-store'}).catch(()=>null)]);const [loader,flow]=await Promise.all([loaderRes?.ok?loaderRes.text():'',flowRes?.ok?flowRes.text():'']);if(loader.includes('Binder Studio v4.0.5 preview')&&loader.includes('ui-flow-polish.css?v=4.0.5')&&flow.includes('v4.0.5')){live=true;break}await sleep(5000)}if(!live)throw new Error('Latest v4.0.5 visual assets did not propagate');
            const browser=await chromium.launch({headless:true});const findings=[],pageErrors=[];let auditedButtons=0,auditedStates=0;
            for(const vp of viewports){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});const page=await context.newPage();
              page.on('pageerror',e=>pageErrors.push(`${vp.name}: ${e.message}`));page.on('console',m=>{if(m.type()==='error')pageErrors.push(`${vp.name} console: ${m.text()}`)});
              await page.goto(BASE+'/?focus=3.3.2&build=4.0.5&fulluiaudit='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>globalThis.KBSPreviewBuild?.version==='4.0.5'&&globalThis.KBSFullThemes?.list?.().length===11&&globalThis.KBSTypography&&!!document.querySelector('#kbsUiFlowPolishStyle'),{timeout:30000});
              const auditState=async(label)=>{
                auditedStates++;
                const rows=await page.evaluate(()=>{const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)>0.05&&r.width>2&&r.height>2};const nearestBg=e=>{let n=e;while(n){const s=getComputedStyle(n),bg=s.backgroundColor;if(bg&&bg!=='transparent'&&!/rgba\([^)]*,\s*0(?:\.0+)?\)/.test(bg))return bg;n=n.parentElement}return getComputedStyle(document.body).backgroundColor};return[...document.querySelectorAll('button,.btn,[role="button"],label.btn,.artlink,.library-build-cta,.page-arrow,.page-number,.version-link,.auto-artwork-more,.mobile-lab-nav-btn,.library-browser-tab,input,select')].filter(visible).map(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return{id:e.id||e.className||e.tagName,text:(e.innerText||e.value||e.getAttribute('aria-label')||e.textContent||'').replace(/\s+/g,' ').trim(),color:s.color,bg:s.backgroundColor,bgImage:s.backgroundImage,fontSize:parseFloat(s.fontSize)||0,fontWeight:s.fontWeight,width:r.width,height:r.height,clientWidth:e.clientWidth,scrollWidth:e.scrollWidth,clientHeight:e.clientHeight,scrollHeight:e.scrollHeight,whiteSpace:s.whiteSpace,overflow:s.overflow,nearestBg:nearestBg(e),radius:parseFloat(s.borderRadius)||0,tag:e.tagName}})});
                auditedButtons+=rows.length;
                for(const b of rows){if(!b.text)continue;const fg=rgba(b.color),own=rgba(b.bg),bg=rgba((b.bg&&own?.a>0.05)?b.bg:b.nearestBg);if(fg&&bg&&b.bgImage==='none'){const cr=contrast(fg,bg),large=b.fontSize>=18||(b.fontSize>=14&&Number.parseInt(b.fontWeight)>=700),min=large?3:4.5;if(cr<min)findings.push({kind:'low-contrast',vp:vp.name,state:label,id:b.id,text:b.text.slice(0,60),ratio:+cr.toFixed(2)})}const clippedX=b.scrollWidth>b.clientWidth+4&&!['normal','pre-wrap','pre-line'].includes(b.whiteSpace);const clippedY=b.scrollHeight>b.clientHeight+5&&b.overflow!=='visible';if(clippedX||clippedY)findings.push({kind:'clipped-text',vp:vp.name,state:label,id:b.id,text:b.text.slice(0,60),box:[Math.round(b.width),Math.round(b.height)],scroll:[b.scrollWidth,b.scrollHeight]});if(b.fontSize<10)findings.push({kind:'tiny-text',vp:vp.name,state:label,id:b.id,text:b.text.slice(0,60),fontSize:b.fontSize});if((b.tag==='BUTTON'||String(b.id).includes('btn'))&&b.height<(vp.name==='mobile'?40:36))findings.push({kind:'tiny-control',vp:vp.name,state:label,id:b.id,text:b.text.slice(0,60),height:b.height});if(b.width>40&&b.height>30&&b.radius<7)findings.push({kind:'square-control',vp:vp.name,state:label,id:b.id,text:b.text.slice(0,60),radius:b.radius})}
              };
              for(const t of expectedThemes){await page.evaluate(id=>KBSFullThemes.apply(id,{persist:false,applyPalette:false}),t);await page.waitForTimeout(30);await auditState(`theme:${t}`)}
              await page.evaluate(()=>KBSFullThemes.apply('lavender',{persist:false,applyPalette:false}));for(const f of expectedFonts){await page.selectOption('#kbsFontSelect',f);await page.waitForTimeout(20);await auditState(`font:${f}`)}
              await page.click('#libraryArtworkTab').catch(()=>{});await page.waitForFunction(()=>!!document.querySelector('#kbsArtSourceLinksScript'),{timeout:15000});await auditState('artwork-tab');await page.click('#libraryCardsTab').catch(()=>{});await auditState('cards-tab');
              const open=vp.name==='desktop'?page.locator('#openBinders:visible'):page.locator('#mobilePageBinders:visible');if(await open.count())await open.click();await page.waitForSelector('#binderModal.open',{timeout:15000});await auditState('my-binders');await page.locator('#closeBinders').click().catch(()=>{});
              await page.locator('#versionLink').click().catch(()=>{});await page.waitForTimeout(50);await auditState('build-info');await page.locator('#buildInfoClose').click().catch(()=>{});
              const helpBefore=await page.$('#kbsHelpLabScript');if(helpBefore)findings.push({kind:'guided-tour-eager',vp:vp.name});const tour=vp.name==='mobile'?page.locator('#mobilePageTour:visible'):page.locator('#guidedTourLaunch:visible');if(await tour.count()){await tour.click();await page.waitForFunction(()=>!!document.querySelector('#kbsHelpLabScript')&&!document.querySelector('#guidedDemo')?.hidden,{timeout:15000});await auditState('guided-tour');await page.keyboard.press('Escape').catch(()=>{})}
              if(vp.name==='mobile')for(const sel of ['[data-mobile-lab="cards"]','[data-mobile-lab="page"]','[data-mobile-lab="art"]']){await page.locator(sel).click().catch(()=>{});await page.waitForTimeout(40);await auditState(sel)}
              await context.close();
            }
            await browser.close();
            const seriousKinds=new Set(['low-contrast','clipped-text','tiny-text','tiny-control','square-control','guided-tour-eager']);const serious=findings.filter(x=>seriousKinds.has(x.kind));console.log('FULL_UI_AUDIT_SUMMARY',JSON.stringify({auditedButtons,auditedStates,findings:findings.length,serious:serious.length,pageErrors:pageErrors.length}));if(findings.length)console.log('FULL_UI_AUDIT_FINDINGS',JSON.stringify(findings,null,2));if(pageErrors.length)console.log('FULL_UI_PAGE_ERRORS',JSON.stringify(pageErrors,null,2));if(serious.length||pageErrors.length)process.exit(1);console.log('FULL_UI_AUDIT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
