name: Probe Safebooru Images

on:
  push:
    branches: [staging-ui-auth-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Embed real Safebooru artwork from staging origin
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE_URL='https://kaseys-binder-studio-staging.jin345.workers.dev';
          const IMAGE='https://safebooru.org/images/4429/8a6e08572f37ad688b4372f1e8e1ac3587936683.jpg';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const failed=[];const responses=[];const errors=[];
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));
            page.on('response',r=>{if(r.url().includes('safebooru.org'))responses.push({url:r.url(),status:r.status(),ct:r.headers()['content-type']||''})});
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto(BASE_URL,{waitUntil:'domcontentloaded',timeout:60000});
            await page.setContent(`<!doctype html><html><body><img id="probe" src="${IMAGE}"></body></html>`,{waitUntil:'load',timeout:60000});
            await page.waitForTimeout(3000);
            const img=await page.locator('#probe').evaluate(i=>({complete:i.complete,w:i.naturalWidth,h:i.naturalHeight,src:i.currentSrc||i.src}));
            console.log('IMAGE',img);
            console.log('RESPONSES',responses);
            console.log('FAILED',failed);
            console.log('ERRORS',errors);
            await browser.close();
            if(!img.complete||img.w<50)throw new Error('Safebooru image did not render from staging origin');
            if(!responses.some(r=>r.status===200&&r.ct.startsWith('image/')))throw new Error('No successful image response');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
