name: Artwork Layout Branch Check

on:
  push:
    branches: [fix-artwork-column-height]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-artwork-column-height
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check public/features/staging-polish.js
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Serve branch locally
        run: |
          python3 -m http.server 4173 --directory public >/tmp/kbs-http.log 2>&1 &
          echo $! > /tmp/kbs-http.pid
          sleep 1
      - name: Verify artwork column uses binder height
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/?layoutqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1600);
            await page.click('#libraryArtworkTab');
            await page.waitForTimeout(700);
            const metrics=await page.evaluate(()=>{
              const lib=document.querySelector('.library');
              const canvas=document.querySelector('.canvas');
              const pane=document.querySelector('.artwork-pane');
              const results=document.querySelector('#autoArtworkSection');
              const arts=document.querySelector('#arts');
              const lr=lib.getBoundingClientRect(),cr=canvas.getBoundingClientRect(),pr=pane.getBoundingClientRect(),rr=results.getBoundingClientRect(),ar=arts.getBoundingClientRect();
              return {
                library:{top:lr.top,bottom:lr.bottom,height:lr.height},
                canvas:{top:cr.top,bottom:cr.bottom,height:cr.height},
                pane:{top:pr.top,bottom:pr.bottom,height:pr.height},
                results:{top:rr.top,bottom:rr.bottom,height:rr.height},
                tray:{top:ar.top,bottom:ar.bottom,height:ar.height},
                sync:lib.dataset.canvasHeightSync||'',
                overflow:getComputedStyle(lib).overflow
              };
            });
            console.log('ARTWORK_LAYOUT_METRICS',JSON.stringify(metrics));
            const bottomDelta=Math.abs(metrics.library.bottom-metrics.canvas.bottom);
            const heightDelta=Math.abs(metrics.library.height-metrics.canvas.height);
            if(!metrics.sync)throw new Error('Runtime canvas height synchronization did not run');
            if(bottomDelta>6)throw new Error(`Library/canvas bottom mismatch ${bottomDelta}px: ${JSON.stringify(metrics)}`);
            if(heightDelta>6)throw new Error(`Library/canvas height mismatch ${heightDelta}px: ${JSON.stringify(metrics)}`);
            if(metrics.pane.bottom>metrics.library.bottom+2)throw new Error('Artwork pane overflows library bottom');
            if(metrics.tray.bottom>metrics.library.bottom+2)throw new Error('Art Tray overflows library bottom');
            if(metrics.results.height<300)throw new Error('Matching Artwork area is still too short');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
