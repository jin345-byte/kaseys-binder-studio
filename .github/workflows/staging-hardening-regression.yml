name: Staging Hardening Regression

on:
  push:
    branches: [prod-db-compat-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-staging-hardening
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod-db-compat-preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static staging safety and print checks
        shell: bash
        run: |
          set -euo pipefail
          node --check src/prod-preview-worker.js
          node --check public/features/staging-v287.js
          python - <<'PY'
          from pathlib import Path

          worker=Path('src/prod-preview-worker.js').read_text()
          for token in [
              'safeStagingEnv',
              "return {ASSETS:env.ASSETS,ZEROCHAN_USERNAME:env.ZEROCHAN_USERNAME}",
              'else if(env.ASSETS)',
              'await env.ASSETS.fetch(request)',
              "x-kbs-preview-asset-isolation",
              'blockedPreviewMutation',
              'previewReadOnly:true'
          ]:
              assert token in worker, token
          for forbidden in [
              'INSERT INTO sessions',
              'DELETE FROM sessions',
              'INSERT INTO binder_snapshots',
              'UPDATE binder_snapshots'
          ]:
              assert forbidden not in worker, forbidden

          rail=Path('public/styles/page-rail-structural-fix.css').read_text()
          for token in [
              'body.mobile-lab-enabled .canvas .canvas-side-controls',
              'body.mobile-lab-enabled .canvas .binder-heading-module .canvashead',
              'grid-template-columns:minmax(0,1fr) 58px',
              'flex-direction:column',
              'flex-wrap:nowrap',
              'overflow-y:auto'
          ]:
              assert token in rail, token

          flow=Path('public/styles/ui-flow-polish.css').read_text()
          assert 'Page-rail geometry intentionally lives only in page-rail-structural-fix.css.' in flow
          assert 'binder-heading-module' not in flow

          app=Path('public/app.js').read_text()
          for token in [
              "w=art?s.columns*70:63",
              "h=art?s.rows*95:88",
              "const pw=columns*70,ph=rows*95",
              "width:${t.cols*63}mm;height:${t.rows*88}mm",
              "grid-template-columns:repeat(3,63mm)",
              "grid-auto-rows:88mm",
              "Print at 100% / Actual size",
              "item.kind==='art'||includeCards"
          ]:
              assert token in app, token

          index=Path('public/index.html').read_text()
          themes=Path('public/features/full-themes.js').read_text()
          assert 'data-theme="lavender"' in index
          assert "DEFAULT_THEME='lavender'" in themes
          assert 'id="setFilter"' in index
          print('STAGING_HARDENING_STATIC_PASS')
          PY

      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Verify deployed staging boundary and page rail
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const PREVIEW='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          async function waitForHardenedPreview(){
            for(let i=0;i<120;i++){
              const r=await fetch(PREVIEW+'/api/config?hardening='+Date.now(),{cache:'no-store'}).catch(()=>null);
              if(r?.ok&&r.headers.get('x-kbs-preview-read-only')==='1'&&r.headers.get('x-kbs-preview-asset-isolation')==='1')return;
              await sleep(5000);
            }
            throw new Error('Hardened staging preview did not propagate');
          }

          function assertRail(label,rail){
            if(rail.sideDisplay!=='flex'||rail.sideDirection!=='column')throw new Error(label+' side-control flow regression: '+JSON.stringify(rail));
            if(rail.headingDisplay!=='grid'||rail.canvasHeadDisplay==='none')throw new Error(label+' heading regression: '+JSON.stringify(rail));
            if(rail.numberDirection!=='column'||rail.numberWrap!=='nowrap'||!['auto','scroll'].includes(rail.numberOverflowY))throw new Error(label+' page-number rail regression: '+JSON.stringify(rail));
            if(rail.navWidth<36||rail.navWidth>48)throw new Error(label+' rail width regression: '+JSON.stringify(rail));
          }

          (async()=>{
            await waitForHardenedPreview();
            const browser=await chromium.launch({headless:true});

            const desktop=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await desktop.newPage();
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            await page.goto(PREVIEW+'/?hardening='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>globalThis.KBSPreviewBuild?.version==='4.0.5'&&globalThis.KBSFullThemes&&globalThis.KBSTypography,{timeout:30000});
            await page.click('#mobilePreviewToggle');
            await page.waitForFunction(()=>document.body.classList.contains('mobile-lab-enabled')&&document.body.classList.contains('mobile-lab-force-preview'),{timeout:10000});
            await page.click('[data-mobile-lab="page"]');
            const forcedRail=await page.evaluate(()=>{
              const side=document.querySelector('.canvas-side-controls'),heading=document.querySelector('.binder-heading-module'),head=document.querySelector('.binder-heading-module .canvashead'),nav=document.querySelector('.binder-heading-module .editor-page-nav'),numbers=document.querySelector('.binder-heading-module .page-numbers');
              const ss=getComputedStyle(side),hs=getComputedStyle(heading),cs=getComputedStyle(head),ns=getComputedStyle(numbers);
              return{sideDisplay:ss.display,sideDirection:ss.flexDirection,headingDisplay:hs.display,canvasHeadDisplay:cs.display,navWidth:nav.getBoundingClientRect().width,numberDirection:ns.flexDirection,numberWrap:ns.flexWrap,numberOverflowY:ns.overflowY};
            });
            assertRail('Forced mobile preview',forcedRail);

            const cfg=await page.request.get(PREVIEW+'/api/config');
            if(cfg.headers()['x-kbs-preview-asset-isolation']!=='1'||cfg.headers()['x-kbs-preview-read-only']!=='1')throw new Error('Preview safety headers missing');
            for(const probe of [{path:'/api/auth/google',method:'POST'},{path:'/api/logout',method:'POST'},{path:'/api/sync',method:'PUT'}]){
              const r=await page.request.fetch(PREVIEW+probe.path,{method:probe.method,data:{qa:true}});
              if(r.status()!==403||r.headers()['x-kbs-preview-read-only']!=='1')throw new Error('Mutation boundary failed: '+probe.method+' '+probe.path+' -> '+r.status());
            }

            const phone=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const mobile=await phone.newPage();
            await mobile.goto(PREVIEW+'/?phone='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await mobile.waitForFunction(()=>document.body.classList.contains('mobile-lab-enabled'),{timeout:10000});
            await mobile.click('[data-mobile-lab="page"]');
            const phoneRail=await mobile.evaluate(()=>{
              const side=document.querySelector('.canvas-side-controls'),heading=document.querySelector('.binder-heading-module'),head=document.querySelector('.binder-heading-module .canvashead'),nav=document.querySelector('.binder-heading-module .editor-page-nav'),numbers=document.querySelector('.binder-heading-module .page-numbers');
              const ss=getComputedStyle(side),hs=getComputedStyle(heading),cs=getComputedStyle(head),ns=getComputedStyle(numbers);
              return{sideDisplay:ss.display,sideDirection:ss.flexDirection,headingDisplay:hs.display,canvasHeadDisplay:cs.display,navWidth:nav.getBoundingClientRect().width,numberDirection:ns.flexDirection,numberWrap:ns.flexWrap,numberOverflowY:ns.overflowY};
            });
            assertRail('390px phone',phoneRail);

            if(pageErrors.length)throw new Error('Browser page errors: '+pageErrors.join(' | '));
            console.log('STAGING_HARDENING_BROWSER_PASS',JSON.stringify({forcedRail,phoneRail}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
