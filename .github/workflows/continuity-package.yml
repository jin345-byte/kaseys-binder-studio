name: Continuity Package Builder

on:
  push:
    branches: [continuity-package-builder-2026-09-07]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch protected backup refs
        run: |
          git fetch origin backup-main-live-production-2026-09-07:refs/remotes/origin/backup-main-live-production-2026-09-07
          git fetch origin backup-prod-db-compat-preview-2026-09-07:refs/remotes/origin/backup-prod-db-compat-preview-2026-09-07
          git fetch origin backup-staging-phase123-2026-09-07:refs/remotes/origin/backup-staging-phase123-2026-09-07
      - name: Build source snapshots
        run: |
          mkdir -p continuity-package/source-snapshots continuity-package/metadata
          git archive --format=zip --output=continuity-package/source-snapshots/MAIN_LIVE_PRODUCTION_bf6f0c1.zip origin/backup-main-live-production-2026-09-07
          git archive --format=zip --output=continuity-package/source-snapshots/PROD_DB_COMPAT_PREVIEW_d53e4ef.zip origin/backup-prod-db-compat-preview-2026-09-07
          git archive --format=zip --output=continuity-package/source-snapshots/STAGING_PHASE123_fec2beb.zip origin/backup-staging-phase123-2026-09-07
          git log --oneline --decorate --graph --all -n 300 > continuity-package/metadata/RECENT_GIT_HISTORY.txt
          git branch -a --contains bf6f0c1ca20a1c51b2d536c8ab79bf8d7f95695e > continuity-package/metadata/MAIN_BACKUP_CONTAINS.txt
          git branch -a --contains d53e4ef8e4157b5cce89e2fade6fd7265c00d3f7 > continuity-package/metadata/PREVIEW_BACKUP_CONTAINS.txt
          git branch -a --contains fec2bebb23744616c4a2f753201fcd078081cb7e > continuity-package/metadata/STAGING_BACKUP_CONTAINS.txt
          git diff --stat bf6f0c1ca20a1c51b2d536c8ab79bf8d7f95695e..d53e4ef8e4157b5cce89e2fade6fd7265c00d3f7 > continuity-package/metadata/MAIN_TO_PREVIEW_DIFFSTAT.txt
          git diff --name-status bf6f0c1ca20a1c51b2d536c8ab79bf8d7f95695e..d53e4ef8e4157b5cce89e2fade6fd7265c00d3f7 > continuity-package/metadata/MAIN_TO_PREVIEW_CHANGED_FILES.txt
          git ls-tree -r --name-only d53e4ef8e4157b5cce89e2fade6fd7265c00d3f7 > continuity-package/metadata/PREVIEW_FILE_INVENTORY.txt
          printf '%s\n' \
            'Repository: jin345-byte/kaseys-binder-studio' \
            'Live production/main SHA: bf6f0c1ca20a1c51b2d536c8ab79bf8d7f95695e' \
            'Backup branch: backup-main-live-production-2026-09-07' \
            'Current development preview SHA: d53e4ef8e4157b5cce89e2fade6fd7265c00d3f7' \
            'Backup branch: backup-prod-db-compat-preview-2026-09-07' \
            'Phase 1-3 staging SHA: fec2bebb23744616c4a2f753201fcd078081cb7e' \
            'Backup branch: backup-staging-phase123-2026-09-07' \
            > continuity-package/metadata/BACKUP_POINTERS.txt
      - name: Upload source continuity artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaseys-binder-studio-source-continuity-2026-09-07
          path: continuity-package
          retention-days: 30
