name: Desktop Formatting Audit

on:
  push:
    branches: [prod-db-compat-preview]
    paths:
      - 'public/**'
      - '.github/workflows/desktop-formatting-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-desktop-formatting-audit
  cancel-in-progress: true

jobs:
  desktop-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod-db-compat-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static source validation
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/features/staging-v287.js
          node --check public/features/full-themes.js
          node --check public/features/typography-picker.js
          node --check public/features/catalog-lab.js
          node --check public/features/prebuilt-catalog-bootstrap.js
          node --check public/features/binder-lab.js
          node --check public/features/cards-lab.js
          test -s public/styles/page-rail-structural-fix.css
          test -s public/styles/layout-overlap-fixes.css
          test -s public/styles/ui-readability-fixes.css
          test -s public/styles/ui-flow-polish.css
          test -s public/styles/desktop-readability-pass.css
          grep -q "grid-template-columns:minmax(0,1fr) 58px" public/styles/page-rail-structural-fix.css
          grep -q "DEFAULT_THEME='lavender'" public/features/full-themes.js
          grep -q "desktop-readability-pass.css?v=1.0.0" public/features/staging-v287.js
          echo DESKTOP_STATIC_PASS
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Audit desktop layouts, themes and typography
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const viewports=[
            {name:'desktop-1440',width:1440,height:1000},
            {name:'desktop-1280',width:1280,height:900},
            {name:'desktop-1100',width:1100,height:850}
          ];
          const themes=['jolteon','pokedex','game-boy','neo-genesis','team-rocket','lavender','cyberpunk','cozy-sakura','dark-academia','e-ink','retro-card-shop'];
          const fonts=['system','verdana','trebuchet','georgia'];
          const rgba=s=>{const m=String(s||'').match(/rgba?\(([^)]+)\)/);if(!m)return null;const p=m[1].split(',').map(Number.parseFloat);return{r:p[0],g:p[1],b:p[2],a:p.length>3?p[3]:1}};
          const lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4};return .2126*f(c.r)+.7152*f(c.g)+.0722*f(c.b)};
          const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
          async function waitLive(){for(let i=0;i<80;i++){const r=await fetch(BASE+'/features/staging-v287.js?desktopqa='+Date.now(),{cache:'no-store'}).catch(()=>null);const t=r?.ok?await r.text():'';if(t.includes('desktop-readability-pass.css?v=1.0.0'))return;await sleep(3000)}throw new Error('Latest staging assets did not become available')}
          (async()=>{
            await waitLive();
            const css=await fetch(BASE+'/styles/desktop-readability-pass.css?desktopqa='+Date.now(),{cache:'no-store'});if(!css.ok)throw new Error('Desktop readability stylesheet unavailable');
            const manifestRes=await fetch(BASE+'/catalog/manifest.json?desktopqa='+Date.now(),{cache:'no-store'});
            if(!manifestRes.ok)throw new Error('Catalog manifest unavailable');
            const manifest=await manifestRes.json();
            const browser=await chromium.launch({headless:true});
            const findings=[],pageErrors=[];
            let audited=0;
            for(const vp of viewports){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
              if(manifest?.version)await context.addInitScript(v=>localStorage.setItem('kbsPrebuiltCatalogVersion',v),manifest.version);
              const page=await context.newPage();
              page.on('pageerror',e=>pageErrors.push(`${vp.name}: ${e.message}`));
              page.on('console',m=>{if(m.type()==='error')pageErrors.push(`${vp.name} console: ${m.text()}`)});
              const response=await page.goto(BASE+'/?desktopqa='+Date.now(),{waitUntil:'commit',timeout:60000});
              if(!response||!response.ok())throw new Error(`${vp.name}: document HTTP ${response?.status()}`);
              await page.waitForSelector('.workspace',{state:'attached',timeout:60000});
              await page.waitForFunction(()=>globalThis.KBSPreviewBuild?.version==='4.0.5'&&globalThis.KBSFullThemes?.list?.().length===11&&globalThis.KBSTypography&&document.querySelector('#kbsPageRailStructuralFixStyle')&&document.querySelector('#kbsDesktopReadabilityPassStyle'),{timeout:90000});

              const audit=async state=>{
                const rows=await page.evaluate(()=>{
                  const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)>.05&&r.width>2&&r.height>2&&r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth};
                  const bgFor=e=>{let n=e;while(n){const b=getComputedStyle(n).backgroundColor;if(b&&b!=='transparent'&&!/rgba\([^)]*,\s*0(?:\.0+)?\)/.test(b))return b;n=n.parentElement}return getComputedStyle(document.body).backgroundColor};
                  return [...document.querySelectorAll('button,.btn,[role="button"],label.btn,.artlink,.library-build-cta,.page-arrow,.page-number,.version-link,.library-browser-tab,input,select,.canvashead h2,.canvashead .status')].filter(visible).map(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return{id:e.id||e.className||e.tagName,text:(e.innerText||e.value||e.getAttribute('aria-label')||e.textContent||'').replace(/\s+/g,' ').trim(),tag:e.tagName,type:e.getAttribute('type')||'',color:s.color,bg:s.backgroundColor,bgImage:s.backgroundImage,nearestBg:bgFor(e),fontSize:parseFloat(s.fontSize)||0,fontWeight:parseInt(s.fontWeight)||400,width:r.width,height:r.height,left:r.left,right:r.right,top:r.top,bottom:r.bottom,clientWidth:e.clientWidth,scrollWidth:e.scrollWidth,clientHeight:e.clientHeight,scrollHeight:e.scrollHeight,whiteSpace:s.whiteSpace,overflowX:s.overflowX,overflowY:s.overflowY}});
                });
                audited+=rows.length;
                for(const x of rows){
                  if(!x.text)continue;
                  if(x.left<-2||x.right>vp.width+2)findings.push({kind:'viewport-overflow',vp:vp.name,state,id:x.id,text:x.text.slice(0,70),box:[Math.round(x.left),Math.round(x.right)]});
                  const clippedX=x.scrollWidth>x.clientWidth+4&&!['normal','pre-wrap','pre-line'].includes(x.whiteSpace)&&x.overflowX!=='visible';
                  const clippedY=x.scrollHeight>x.clientHeight+5&&x.overflowY!=='visible';
                  if(clippedX||clippedY)findings.push({kind:'clipped-text',vp:vp.name,state,id:x.id,text:x.text.slice(0,70),box:[Math.round(x.width),Math.round(x.height)],scroll:[x.scrollWidth,x.scrollHeight]});
                  if(x.fontSize<10)findings.push({kind:'tiny-text',vp:vp.name,state,id:x.id,text:x.text.slice(0,70),fontSize:x.fontSize});
                  if(x.tag==='BUTTON'&&x.height<34)findings.push({kind:'tiny-button',vp:vp.name,state,id:x.id,text:x.text.slice(0,70),height:Math.round(x.height)});
                  if(x.type!=='color'){
                    const fg=rgba(x.color),own=rgba(x.bg),bg=rgba(own?.a>.05?x.bg:x.nearestBg);
                    if(fg&&bg&&x.bgImage==='none'){
                      const ratio=contrast(fg,bg),large=x.fontSize>=18||(x.fontSize>=14&&x.fontWeight>=700),min=large?3:4.5;
                      if(ratio<min)findings.push({kind:'low-contrast',vp:vp.name,state,id:x.id,text:x.text.slice(0,70),ratio:+ratio.toFixed(2)});
                    }
                  }
                }
                const structure=await page.evaluate(()=>{
                  const q=s=>document.querySelector(s),rect=s=>q(s)?.getBoundingClientRect();
                  const work=rect('.workspace'),lib=rect('.library'),canvas=rect('.canvas'),heading=rect('.binder-heading-module'),nav=rect('.binder-heading-module .editor-page-nav');
                  const ns=q('.binder-heading-module .page-numbers')?getComputedStyle(q('.binder-heading-module .page-numbers')):null;
                  return{work,lib,canvas,heading,nav,navDirection:ns?.flexDirection};
                });
                if(!structure.work||!structure.lib||!structure.canvas||!structure.heading||!structure.nav)findings.push({kind:'missing-structure',vp:vp.name,state});
                else {
                  if(structure.lib.right>structure.canvas.right+1)findings.push({kind:'workspace-overlap',vp:vp.name,state});
                  if(structure.nav.width<40||structure.nav.width>50||structure.navDirection!=='column')findings.push({kind:'desktop-page-rail',vp:vp.name,state,width:structure.nav.width,direction:structure.navDirection});
                }
              };

              await audit('default');
              for(const t of themes){await page.evaluate(id=>KBSFullThemes.apply(id,{persist:false,applyPalette:false}),t);await page.waitForTimeout(30);await audit('theme:'+t)}
              await page.evaluate(()=>KBSFullThemes.apply('lavender',{persist:false,applyPalette:false}));
              for(const f of fonts){await page.selectOption('#kbsFontSelect',f);await page.waitForTimeout(20);await audit('font:'+f)}
              await page.click('#libraryArtworkTab');await page.waitForFunction(()=>!!document.querySelector('#kbsArtSourceLinksScript'),{timeout:20000});await audit('artwork-tab');
              await page.click('#libraryCardsTab');await audit('cards-tab');
              await page.click('#openBinders');await page.waitForSelector('#binderModal.open',{state:'visible',timeout:20000});await audit('my-binders');await page.click('#closeBinders');
              await page.click('#versionLink');await page.waitForTimeout(50);await audit('build-info');await page.click('#buildInfoClose');
              await context.close();
            }
            await browser.close();
            console.log('DESKTOP_FORMATTING_SUMMARY',JSON.stringify({audited,findings:findings.length,pageErrors:pageErrors.length}));
            if(findings.length)console.log('DESKTOP_FORMATTING_FINDINGS',JSON.stringify(findings,null,2));
            if(pageErrors.length)console.log('DESKTOP_PAGE_ERRORS',JSON.stringify(pageErrors,null,2));
            if(findings.length||pageErrors.length)process.exit(1);
            console.log('DESKTOP_FORMATTING_AUDIT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
