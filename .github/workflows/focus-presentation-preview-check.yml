name: Focus Presentation Preview Check

on:
  push:
    branches: [prod-db-compat-preview]
    paths:
      - 'public/features/focus-presentation-mode.js'
      - 'public/styles/focus-presentation-mode.css'
      - 'public/features/staging-v287.js'
      - '.github/workflows/focus-presentation-preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-focus-presentation
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: |
          node --check public/features/focus-presentation-mode.js
          grep -q 'focus-presentation-mode.css?v=3.3.0' public/features/staging-v287.js
          grep -q 'focus-presentation-mode.js?v=3.3.0' public/features/staging-v287.js
          grep -q 'KBSFocusPresentation' public/features/focus-presentation-mode.js
          grep -q 'focus-presentation-mode' public/styles/focus-presentation-mode.css
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify deployed focus presentation mode
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let live=false;
            for(let i=0;i<30;i++){
              const r=await fetch(BASE+'/features/focus-presentation-mode.js?qa='+Date.now(),{cache:'no-store'}).catch(()=>null);
              const t=r?.ok?await r.text().catch(()=>''):'';
              if(t.includes('KBSFocusPresentation')&&t.includes('Preview Binder')){live=true;break;}
              await sleep(6000);
            }
            if(!live)throw new Error('Focus presentation assets did not propagate');
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(BASE+'/?focusqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#previewBinder',{timeout:30000});
            const before=await page.$eval('#previewBinder',el=>({text:el.textContent,visible:!!(el.offsetWidth||el.offsetHeight)}));
            if(!before.visible||!before.text.includes('Preview Binder'))throw new Error('Preview Binder button missing');
            await page.click('#previewBinder');
            await page.waitForSelector('#focusPresentation.open .focus-page-shell',{timeout:15000});
            const state=await page.evaluate(()=>({
              body:document.body.classList.contains('focus-presentation-mode'),
              overlay:document.querySelector('#focusPresentation')?.classList.contains('open'),
              appVisibility:getComputedStyle(document.querySelector('.app')).visibility,
              grid:document.querySelectorAll('#focusPresentation .grid').length,
              exit:!!document.querySelector('#focusPresentationExit')
            }));
            if(!state.body||!state.overlay||state.appVisibility!=='hidden'||state.grid<1||!state.exit)throw new Error('Focus mode state mismatch '+JSON.stringify(state));
            await page.keyboard.press('Escape');
            await page.waitForFunction(()=>!document.body.classList.contains('focus-presentation-mode'));
            const after=await page.evaluate(()=>({overlay:document.querySelector('#focusPresentation')?.classList.contains('open'),appVisibility:getComputedStyle(document.querySelector('.app')).visibility}));
            if(after.overlay||after.appVisibility==='hidden')throw new Error('Focus mode did not restore app '+JSON.stringify(after));
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            await browser.close();
            console.log('FOCUS_PRESENTATION_PASS',JSON.stringify({before,state,after}));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
