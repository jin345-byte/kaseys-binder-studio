name: Deploy V4 Release Candidate

on:
  push:
    branches:
      - production-release-v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-v4-release-candidate
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release-candidate isolation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/production-release-v4"
          grep -q 'kaseys-binder-studio-v4-rc' wrangler.release-candidate.jsonc
          grep -q 'kaseys-binder-studio-staging-db' wrangler.release-candidate.jsonc
          grep -q '7f42e214-4995-4240-9044-623a52eeed52' wrangler.release-candidate.jsonc
          if grep -q 'ea5aaa71-88e3-4bff-b997-7aa9bff3c24d' wrangler.release-candidate.jsonc; then
            echo 'Production D1 database ID found in release-candidate config. Refusing deployment.'
            exit 1
          fi
          if test -e src/staging-worker.js || test -e src/prod-preview-worker.js; then
            echo 'Staging-only Worker source found in release branch. Refusing deployment.'
            exit 1
          fi
          if grep -R -q 'staging-fetch-shim' public/index.html public/features/production-v4.js; then
            echo 'Staging fetch shim referenced by release candidate. Refusing deployment.'
            exit 1
          fi

      - name: Syntax and compatibility checks
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check public/features/cloud-sync.js
          node --check public/features/production-v4.js
          node --check public/features/viewer-legacy-layout-repair.js
          grep -q "syncVersion:2" src/worker.js
          grep -q "baseRevision" src/worker.js
          grep -q "LAST_REVISION_KEY" public/features/cloud-sync.js
          grep -q "cloudSyncVersion:2" public/features/production-v4.js
          grep -q "productionSafe:true" public/features/production-v4.js
          grep -q "readOnlyCloud:false" public/features/production-v4.js

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Apply isolated candidate D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute kaseys-binder-studio-staging-db --remote --file=./migrations/0001_auth_sync.sql --config=wrangler.release-candidate.jsonc

      - name: Deploy isolated candidate Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config=wrangler.release-candidate.jsonc

      - name: Verify candidate API
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaseys-binder-studio-v4-rc.jin345.workers.dev'
          for i in 1 2 3 4 5; do
            BODY="$(curl -fsS "$BASE/api/config" || true)"
            if echo "$BODY" | grep -q '"syncVersion":2'; then
              echo "$BODY"
              exit 0
            fi
            sleep 4
          done
          echo 'Candidate /api/config did not report syncVersion 2.'
          exit 1

      - name: Deployment summary
        run: |
          echo '### Binder Studio v4 release candidate deployed' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Branch: `production-release-v4`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Worker: `kaseys-binder-studio-v4-rc`' >> "$GITHUB_STEP_SUMMARY"
          echo '- URL: https://kaseys-binder-studio-v4-rc.jin345.workers.dev' >> "$GITHUB_STEP_SUMMARY"
          echo '- Database: isolated staging D1 only' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production D1 and production Worker were not used.' >> "$GITHUB_STEP_SUMMARY"
