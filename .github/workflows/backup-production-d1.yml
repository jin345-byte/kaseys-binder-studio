name: Backup Production D1

on:
  push:
    branches:
      - production-d1-backup-2026-09-21
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Verify production database target
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'kaseys-binder-studio-db' wrangler.jsonc
          grep -q 'ea5aaa71-88e3-4bff-b997-7aa9bff3c24d' wrangler.jsonc
      - name: Export production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 export kaseys-binder-studio-db --remote --output=production-d1-backup-2026-09-21.sql --config=wrangler.jsonc
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-backup-2026-09-21
          path: production-d1-backup-2026-09-21.sql
          if-no-files-found: error
          retention-days: 30
