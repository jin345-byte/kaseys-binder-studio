name: Test Artwork Providers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test fan-art providers and staging path
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test provider APIs and parser
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error

          UA='Kaseys-Binder-Studio-Art-Test/1.1'
          STAGING='https://kaseys-binder-studio-staging.jin345.workers.dev'

          def get(url, accept='*/*'):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept,'Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read()
                      ct=r.headers.get('content-type','')
                      print(f'GET {url}')
                      print('STATUS',r.status,'CONTENT-TYPE',ct,'BYTES',len(body))
                      return r.status, ct, dict(r.headers), body
              except urllib.error.HTTPError as e:
                  body=e.read()
                  print(f'GET {url}')
                  print('HTTP ERROR',e.code,'CONTENT-TYPE',e.headers.get('content-type',''),'PREFIX',repr(body[:300]))
                  return e.code, e.headers.get('content-type',''), dict(e.headers), body
              except Exception as e:
                  print(f'GET {url}')
                  print('ERROR',repr(e))
                  return 0,'',{},b''

          def get_json(url):
              status,ct,headers,body=get(url,'application/json')
              text=body.decode('utf-8','replace')
              try:
                  return status,ct,headers,json.loads(text)
              except Exception:
                  print('NON-JSON PREFIX:',repr(text[:300]))
                  return status,ct,headers,None

          def valid_image_url(v):
              if not isinstance(v,str) or not v.startswith('https://'):
                  return False
              try:
                  p=urllib.parse.urlparse(v)
              except Exception:
                  return False
              host=p.hostname or ''
              allowed=(host=='safebooru.org' or host.endswith('.safebooru.org') or host=='donmai.us' or host.endswith('.donmai.us'))
              ext=p.path.lower().rsplit('.',1)[-1] if '.' in p.path else ''
              return allowed and ext in {'jpg','jpeg','png','webp','gif'}

          tags=['eevee','pikachu','gardevoir']
          provider_ok=False

          for tag in tags:
              print('\n===',tag.upper(),'===')

              safe_url='https://safebooru.org/index.php?'+urllib.parse.urlencode({
                  'page':'dapi','s':'post','q':'index','json':'1','limit':'20','pid':'0','tags':tag
              })
              _,_,_,safe=get_json(safe_url)
              safe_rows=safe if isinstance(safe,list) else (safe.get('post',[]) if isinstance(safe,dict) and isinstance(safe.get('post'),list) else [])
              safe_valid=[]
              for p in safe_rows:
                  u=p.get('file_url') or p.get('sample_url') or p.get('preview_url')
                  if valid_image_url(u): safe_valid.append(u)
              print('SAFEBOORU POSTS',len(safe_rows),'VALID IMAGE URLS',len(safe_valid))
              if safe_valid: print('SAFEBOORU SAMPLE',safe_valid[0])

              dan_url='https://safebooru.donmai.us/posts.json?'+urllib.parse.urlencode({
                  'limit':'20','page':'1','tags':f'{tag} rating:g'
              })
              _,_,_,dan=get_json(dan_url)
              dan_rows=dan if isinstance(dan,list) else []
              dan_valid=[]
              for p in dan_rows:
                  u=p.get('large_file_url') or p.get('file_url') or p.get('preview_file_url')
                  if valid_image_url(u): dan_valid.append(u)
              print('DONMAI SAFE POSTS',len(dan_rows),'VALID IMAGE URLS',len(dan_valid))
              if dan_valid: print('DONMAI SAMPLE',dan_valid[0])

              if len(safe_valid)+len(dan_valid)>=5:
                  provider_ok=True

          print('\n=== LIVE STAGING API ===')
          api_url=STAGING+'/api/art-search?'+urllib.parse.urlencode({'tag':'eevee','page':'0','diag':'1'})
          api_status,api_ct,api_headers,api=get_json(api_url)
          api_results=api.get('results',[]) if isinstance(api,dict) and isinstance(api.get('results'),list) else []
          api_valid=[r.get('url') for r in api_results if isinstance(r,dict) and valid_image_url(r.get('url'))]
          print('STAGING API STATUS',api_status)
          print('STAGING API PROVIDERS',api.get('providers') if isinstance(api,dict) else None)
          print('STAGING API RESULTS',len(api_results),'VALID',len(api_valid))
          print('STAGING ART BUILD',api_headers.get('x-kbs-art-build') or api_headers.get('X-Kbs-Art-Build'))
          if api_valid: print('STAGING API SAMPLE',api_valid[0])

          print('\n=== LIVE STAGING HTML ===')
          html_status,html_ct,html_headers,html_body=get(STAGING+'/','text/html')
          html=html_body.decode('utf-8','replace')
          proxy_pos=html.find('art-search-proxy.js')
          lab_pos=html.find('art-search-lab.js')
          print('HTML STATUS',html_status)
          print('PROXY POSITION',proxy_pos,'LAB POSITION',lab_pos)
          print('HTML ART BUILD',html_headers.get('x-kbs-art-build') or html_headers.get('X-Kbs-Art-Build'))
          injection_ok=proxy_pos>=0 and lab_pos>=0 and proxy_pos < lab_pos
          print('PROXY BEFORE LAB',injection_ok)

          print('\n=== RESULT ===')
          if not provider_ok:
              raise SystemExit('FAIL: upstream fan-art providers did not return a useful batch.')
          if api_status != 200 or len(api_valid) < 5:
              raise SystemExit('FAIL: live staging /api/art-search did not return a useful fan-art batch.')
          if html_status != 200 or not injection_ok:
              raise SystemExit('FAIL: live staging HTML is not loading the artwork proxy before the artwork module.')
          print('PASS: providers, live staging API, and script injection are all working end-to-end.')
          PY
