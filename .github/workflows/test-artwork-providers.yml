name: Test Artwork Providers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test fan-art providers, CORS, and staging path
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test provider APIs and browser CORS
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error

          UA='Kaseys-Binder-Studio-Art-Test/1.2'
          ORIGIN='https://kaseys-binder-studio-staging.jin345.workers.dev'
          STAGING=ORIGIN

          def get(url, accept='*/*', origin=None):
              headers={'User-Agent':UA,'Accept':accept,'Cache-Control':'no-cache'}
              if origin: headers['Origin']=origin
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read(); ct=r.headers.get('content-type','')
                      print(f'GET {url}')
                      print('STATUS',r.status,'CONTENT-TYPE',ct,'BYTES',len(body))
                      if origin:
                          print('ACAO',r.headers.get('access-control-allow-origin'))
                          print('VARY',r.headers.get('vary'))
                      return r.status,ct,dict(r.headers),body
              except urllib.error.HTTPError as e:
                  body=e.read()
                  print(f'GET {url}')
                  print('HTTP ERROR',e.code,'CONTENT-TYPE',e.headers.get('content-type',''),'PREFIX',repr(body[:300]))
                  if origin: print('ACAO',e.headers.get('access-control-allow-origin'))
                  return e.code,e.headers.get('content-type',''),dict(e.headers),body
              except Exception as e:
                  print(f'GET {url}'); print('ERROR',repr(e)); return 0,'',{},b''

          def get_json(url, origin=None):
              status,ct,headers,body=get(url,'application/json',origin)
              try: return status,ct,headers,json.loads(body.decode('utf-8','replace'))
              except Exception:
                  print('NON-JSON PREFIX:',repr(body[:300])); return status,ct,headers,None

          def valid_image_url(v):
              if not isinstance(v,str) or not v.startswith('https://'): return False
              p=urllib.parse.urlparse(v); host=p.hostname or ''
              allowed=(host=='safebooru.org' or host.endswith('.safebooru.org') or host=='donmai.us' or host.endswith('.donmai.us'))
              ext=p.path.lower().rsplit('.',1)[-1] if '.' in p.path else ''
              return allowed and ext in {'jpg','jpeg','png','webp','gif'}

          print('\n=== UPSTREAM PROVIDERS ===')
          for tag in ['eevee','pikachu','gardevoir']:
              print('\n---',tag.upper(),'---')
              safe_url='https://safebooru.org/index.php?'+urllib.parse.urlencode({'page':'dapi','s':'post','q':'index','json':'1','limit':'20','pid':'0','tags':tag})
              _,_,_,safe=get_json(safe_url)
              safe_rows=safe if isinstance(safe,list) else (safe.get('post',[]) if isinstance(safe,dict) and isinstance(safe.get('post'),list) else [])
              safe_valid=[p.get('file_url') or p.get('sample_url') or p.get('preview_url') for p in safe_rows]
              safe_valid=[u for u in safe_valid if valid_image_url(u)]
              print('SAFEBOORU POSTS',len(safe_rows),'VALID',len(safe_valid))

              dan_url='https://safebooru.donmai.us/posts.json?'+urllib.parse.urlencode({'limit':'20','page':'1','tags':f'{tag} rating:g'})
              _,_,_,dan=get_json(dan_url)
              dan_rows=dan if isinstance(dan,list) else []
              dan_valid=[p.get('large_file_url') or p.get('file_url') or p.get('preview_file_url') for p in dan_rows]
              dan_valid=[u for u in dan_valid if valid_image_url(u)]
              print('DONMAI SAFE POSTS',len(dan_rows),'VALID',len(dan_valid))

          print('\n=== BROWSER CORS TEST ===')
          cors_url='https://safebooru.donmai.us/posts.json?'+urllib.parse.urlencode({'limit':'20','page':'1','tags':'eevee rating:g'})
          cors_status,_,cors_headers,cors_json=get_json(cors_url,ORIGIN)
          acao=(cors_headers.get('access-control-allow-origin') or cors_headers.get('Access-Control-Allow-Origin') or '')
          cors_rows=cors_json if isinstance(cors_json,list) else []
          print('CORS STATUS',cors_status,'ACAO',repr(acao),'ROWS',len(cors_rows))
          browser_direct_ok=(cors_status==200 and len(cors_rows)>=5 and (acao=='*' or acao==ORIGIN))
          print('BROWSER DIRECT API OK',browser_direct_ok)

          print('\n=== LIVE STAGING API ===')
          api_url=STAGING+'/api/art-search?'+urllib.parse.urlencode({'tag':'eevee','page':'0','diag':'1'})
          api_status,_,api_headers,api=get_json(api_url)
          api_results=api.get('results',[]) if isinstance(api,dict) and isinstance(api.get('results'),list) else []
          print('STAGING API STATUS',api_status,'PROVIDERS',api.get('providers') if isinstance(api,dict) else None,'RESULTS',len(api_results))
          print('STAGING ART BUILD',api_headers.get('x-kbs-art-build') or api_headers.get('X-Kbs-Art-Build'))

          print('\n=== LIVE STAGING HTML ===')
          html_status,_,html_headers,html_body=get(STAGING+'/','text/html')
          html=html_body.decode('utf-8','replace')
          proxy_pos=html.find('art-search-proxy.js'); lab_pos=html.find('art-search-lab.js')
          print('HTML STATUS',html_status,'PROXY POSITION',proxy_pos,'LAB POSITION',lab_pos,'PROXY BEFORE LAB',proxy_pos>=0 and lab_pos>=0 and proxy_pos<lab_pos)
          print('HTML ART BUILD',html_headers.get('x-kbs-art-build') or html_headers.get('X-Kbs-Art-Build'))

          print('\n=== RESULT ===')
          if browser_direct_ok:
              print('PASS: safe Donmai supports direct browser CORS from the staging origin; Worker fan-art proxy can be removed.')
          else:
              raise SystemExit('FAIL: direct browser CORS is not proven; keep staging unchanged and investigate another transport.')
          PY
