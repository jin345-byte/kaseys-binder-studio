name: Animated Theme Accents Check

on:
  push:
    branches: [prod-db-compat-preview]
    paths:
      - 'public/styles/theme-animated-accents.css'
      - 'public/features/full-themes.js'
      - 'public/features/staging-v287.js'
      - '.github/workflows/animated-theme-accents-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-animated-theme-accents
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: |
          node --check public/features/full-themes.js
          grep -q 'theme-animated-accents.css?v=3.4.0' public/features/full-themes.js
          grep -q 'full-themes.js?v=3.4.0' public/features/staging-v287.js
          grep -q 'prefers-reduced-motion:reduce' public/styles/theme-animated-accents.css
          grep -q 'data-theme="cyberpunk"' public/styles/theme-animated-accents.css
          grep -q 'data-theme="cozy-sakura"' public/styles/theme-animated-accents.css
          grep -q 'data-theme="e-ink"' public/styles/theme-animated-accents.css
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify deployed animated accents and geometry lock
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let live=false;
            for(let i=0;i<30;i++){
              const [cssRes,jsRes]=await Promise.all([
                fetch(BASE+'/styles/theme-animated-accents.css?qa='+Date.now(),{cache:'no-store'}).catch(()=>null),
                fetch(BASE+'/features/full-themes.js?qa='+Date.now(),{cache:'no-store'}).catch(()=>null)
              ]);
              const css=cssRes?.ok?await cssRes.text().catch(()=>''):'';
              const js=jsRes?.ok?await jsRes.text().catch(()=>''):'';
              if(css.includes('kbsCyberGrid')&&css.includes('prefers-reduced-motion:reduce')&&js.includes('theme-animated-accents.css?v=3.4.0')){live=true;break;}
              await sleep(6000);
            }
            if(!live)throw new Error('Animated accent assets did not propagate');

            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000},reducedMotion:'no-preference'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(BASE+'/?accentqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#fullThemeSelect',{timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#kbsThemeAnimatedAccentsStyle'));

            const themes=['jolteon','pokedex','game-boy','neo-genesis','team-rocket','lavender','cyberpunk','cozy-sakura','dark-academia','e-ink','retro-card-shop'];
            const baseline=await page.evaluate(()=>{
              const b=document.querySelector('#openBinders')||document.querySelector('.controls button');
              const r=b?.getBoundingClientRect();
              return r?{x:r.x,y:r.y,w:r.width,h:r.height}:null;
            });
            const states=[];
            for(const theme of themes){
              await page.selectOption('#fullThemeSelect',theme);
              await page.waitForTimeout(120);
              const s=await page.evaluate(()=>{
                const body=getComputedStyle(document.body);
                const grid=document.querySelector('#grid');
                const gs=grid?getComputedStyle(grid):null;
                const active=document.querySelector('.page-number.active,.page-number[aria-current="page"],.btn.primary');
                const as=active?getComputedStyle(active):null;
                const b=document.querySelector('#openBinders')||document.querySelector('.controls button');
                const r=b?.getBoundingClientRect();
                return {theme:document.body.dataset.theme,bodyAnimation:body.animationName,gridAnimation:gs?.animationName||'',activeAnimation:as?.animationName||'',button:r?{x:r.x,y:r.y,w:r.width,h:r.height}:null};
              });
              if(s.theme!==theme)throw new Error('Theme did not apply: '+theme);
              if(!s.bodyAnimation&&!s.gridAnimation&&!s.activeAnimation)throw new Error('No accent animation detected for '+theme);
              if(baseline&&s.button){
                const d=Math.max(Math.abs(baseline.x-s.button.x),Math.abs(baseline.y-s.button.y),Math.abs(baseline.w-s.button.w),Math.abs(baseline.h-s.button.h));
                if(d>1)throw new Error('Theme accent changed button geometry for '+theme+' by '+d+'px');
              }
              states.push(s);
            }
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            await page.close();

            const reduced=await browser.newPage({viewport:{width:1200,height:850},reducedMotion:'reduce'});
            await reduced.goto(BASE+'/?accentreduce='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await reduced.waitForSelector('#fullThemeSelect',{timeout:30000});
            await reduced.selectOption('#fullThemeSelect','cyberpunk');
            const reducedState=await reduced.evaluate(()=>({body:getComputedStyle(document.body).animationName,grid:getComputedStyle(document.querySelector('#grid')).animationName}));
            if(reducedState.body!=='none'||reducedState.grid!=='none')throw new Error('Reduced motion did not disable theme accents '+JSON.stringify(reducedState));
            await reduced.close();
            await browser.close();
            console.log('ANIMATED_THEME_ACCENTS_PASS',JSON.stringify({themes:states.map(x=>x.theme),reducedState}));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
