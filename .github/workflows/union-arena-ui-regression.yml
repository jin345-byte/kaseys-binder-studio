name: Union Arena UI Regression

on:
  push:
    branches: [prod-db-compat-preview]
    paths:
      - 'public/styles/appearance-cleanup.css'
      - 'public/features/staging-v287.js'
      - 'public/features/catalog-lab.js'
      - 'public/features/prebuilt-catalog-bootstrap.js'
      - 'public/catalog/**'
      - '.github/workflows/union-arena-ui-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-union-arena-ui-regression
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static Union Arena checks
        shell: bash
        run: |
          set -euo pipefail
          node --check public/features/catalog-lab.js
          node --check public/features/prebuilt-catalog-bootstrap.js
          node --check public/features/staging-v287.js
          grep -q "Union Arena" public/features/catalog-lab.js
          grep -q "value=\"union-arena\"" public/features/catalog-lab.js
          grep -q "appearance-cleanup.css?v=2.9.6" public/features/staging-v287.js
          ! grep -A2 "multi-tcg-filterbar" public/styles/appearance-cleanup.css | grep -q "display:none"
          node <<'JS'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('public/catalog/manifest.json','utf8'));
          const n=Number(m.counts?.unionArena||m.unionArena||0);
          if(n<6000)throw new Error('Union Arena catalog count too low: '+n);
          console.log('UNION_ARENA_STATIC_PASS',n);
          JS
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify deployed Union Arena controls and cards
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let live=false;
            for(let i=0;i<60;i++){
              const r=await fetch(BASE+'/features/staging-v287.js?ua-regression='+Date.now(),{cache:'no-store'}).catch(()=>null);
              const t=r?.ok?await r.text():'';
              if(t.includes('appearance-cleanup.css?v=2.9.6')){live=true;break}
              await sleep(5000);
            }
            if(!live)throw new Error('Restored Union Arena styles did not propagate');
            const browser=await chromium.launch({headless:true});
            for(const viewport of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              const page=await browser.newPage({viewport});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto(BASE+'/?focus=3.3.2&ua-regression='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('#tcgGameFilter',{state:'attached',timeout:30000});
              await page.waitForFunction(()=>{
                const e=document.querySelector('#tcgGameFilter');if(!e)return false;
                const s=getComputedStyle(e),r=e.getBoundingClientRect();
                return s.display!=='none'&&s.visibility!=='hidden'&&r.width>20&&r.height>=36;
              },null,{timeout:30000});
              const manifest=await (await page.request.get(BASE+'/catalog/manifest.json?ua='+Date.now())).json();
              if(Number(manifest.counts?.unionArena||manifest.unionArena||0)<6000)throw new Error(viewport.name+': deployed Union Arena catalog missing');
              await page.waitForFunction(()=>Array.isArray(globalThis.KBSCatalogCards)&&globalThis.KBSCatalogCards.filter(x=>x?.game==='union-arena').length>=6000,null,{timeout:120000});
              await page.selectOption('#tcgGameFilter','union-arena');
              await page.fill('#subject','Abengane');
              await page.click('#searchBtn');
              await page.waitForFunction(()=>document.querySelectorAll('#cards .card-item.is-union-card').length>0,null,{timeout:60000});
              const state=await page.evaluate(()=>({
                visible:(()=>{const e=document.querySelector('.multi-tcg-filterbar'),s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>20&&r.height>20})(),
                game:document.querySelector('#tcgGameFilter')?.value,
                unionCards:globalThis.KBSCatalogCards.filter(x=>x?.game==='union-arena').length,
                resultCards:document.querySelectorAll('#cards .card-item.is-union-card').length,
                badge:document.querySelector('#cards .union-source-badge')?.textContent||'',
                filters:['#tcgSeriesFilter','#tcgColorFilter','#tcgRarityFilter','#tcgTypeFilter'].every(sel=>document.querySelector(sel)?.options.length>1)
              }));
              if(!state.visible||state.game!=='union-arena'||state.unionCards<6000||state.resultCards<1||!/Union Arena/.test(state.badge)||!state.filters)throw new Error(viewport.name+': Union Arena UI regression '+JSON.stringify(state));
              if(errors.length)throw new Error(viewport.name+': '+errors.join(' | '));
              await page.close();
            }
            await browser.close();
            console.log('UNION_ARENA_UI_REGRESSION_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
