name: Union Arena UI Regression

on:
  push:
    branches: [prod-db-compat-preview]
    paths:
      - 'public/styles/appearance-cleanup.css'
      - 'public/features/staging-v287.js'
      - 'public/features/catalog-lab.js'
      - 'public/features/prebuilt-catalog-bootstrap.js'
      - 'public/catalog/**'
      - '.github/workflows/union-arena-ui-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-studio-union-arena-ui-regression
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static Union Arena checks
        shell: bash
        run: |
          set -euo pipefail
          node --check public/features/catalog-lab.js
          node --check public/features/prebuilt-catalog-bootstrap.js
          node --check public/features/staging-v287.js
          grep -q "Union Arena" public/features/catalog-lab.js
          grep -q "appearance-cleanup.css?v=2.9.7" public/features/staging-v287.js
          grep -A2 "multi-tcg-filterbar" public/styles/appearance-cleanup.css | grep -q "display:none"
          node <<'JS'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('public/catalog/manifest.json','utf8'));
          const n=Number(m.counts?.unionArena||m.unionArena||0);
          if(n<6000)throw new Error('Union Arena catalog count too low: '+n);
          console.log('UNION_ARENA_STATIC_PASS',n);
          JS
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify deployed Union Arena remains available through Set
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://kaseys-binder-studio-prod-preview.jin345.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let live=false;
            for(let i=0;i<60;i++){
              const r=await fetch(BASE+'/features/staging-v287.js?ua-regression='+Date.now(),{cache:'no-store'}).catch(()=>null);
              const t=r?.ok?await r.text():'';
              if(t.includes('appearance-cleanup.css?v=2.9.7')){live=true;break}
              await sleep(5000);
            }
            if(!live)throw new Error('Set-only Union Arena UI did not propagate');
            const browser=await chromium.launch({headless:true});
            for(const viewport of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              const page=await browser.newPage({viewport});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto(BASE+'/?focus=3.3.2&ua-regression='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('#setFilter',{state:'visible',timeout:30000});
              await page.waitForFunction(()=>{
                const e=document.querySelector('.multi-tcg-filterbar');
                return !!e&&getComputedStyle(e).display==='none';
              },null,{timeout:30000});
              const manifest=await (await page.request.get(BASE+'/catalog/manifest.json?ua='+Date.now())).json();
              if(Number(manifest.counts?.unionArena||manifest.unionArena||0)<6000)throw new Error(viewport.name+': deployed Union Arena catalog missing');
              await page.waitForFunction(()=>Array.isArray(globalThis.KBSCatalogCards)&&globalThis.KBSCatalogCards.filter(x=>x?.game==='union-arena').length>=6000,null,{timeout:120000});
              await page.waitForFunction(()=>[...document.querySelector('#setFilter').options].some(o=>String(o.value).startsWith('union-arena:')),null,{timeout:60000});
              const unionSet=await page.evaluate(()=>[...document.querySelector('#setFilter').options].find(o=>String(o.value).startsWith('union-arena:'))?.value||'');
              if(!unionSet)throw new Error(viewport.name+': no Union Arena set option found');
              await page.selectOption('#setFilter',unionSet);
              await page.fill('#subject','');
              await page.click('#searchBtn');
              await page.waitForFunction(()=>document.querySelectorAll('#cards .card-item.is-union-card').length>0,null,{timeout:60000});
              const state=await page.evaluate(()=>({
                hidden:getComputedStyle(document.querySelector('.multi-tcg-filterbar')).display==='none',
                setValue:document.querySelector('#setFilter')?.value||'',
                unionSetOptions:[...document.querySelector('#setFilter').options].filter(o=>String(o.value).startsWith('union-arena:')).length,
                unionCards:globalThis.KBSCatalogCards.filter(x=>x?.game==='union-arena').length,
                resultCards:document.querySelectorAll('#cards .card-item.is-union-card').length,
                badge:document.querySelector('#cards .union-source-badge')?.textContent||''
              }));
              if(!state.hidden||!state.setValue.startsWith('union-arena:')||state.unionSetOptions<1||state.unionCards<6000||state.resultCards<1||!/Union Arena/.test(state.badge))throw new Error(viewport.name+': Union Arena Set regression '+JSON.stringify(state));
              if(errors.length)throw new Error(viewport.name+': '+errors.join(' | '));
              await page.close();
            }
            await browser.close();
            console.log('UNION_ARENA_SET_ONLY_REGRESSION_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
