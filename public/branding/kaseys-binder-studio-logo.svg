<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1840 300" role="img" aria-label="Kasey's Binder Studio">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8b4fe"/><stop offset=".28" stop-color="#8b5cf6"/><stop offset=".65" stop-color="#6d28d9"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#e9d5ff"/><stop offset=".68" stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".34" stop-color="#efd5ff"/><stop offset=".68" stop-color="#c084fc"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".65" stop-color="#f5e9ff"/><stop offset="1" stop-color="#d8b4fe"/></linearGradient>
  <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#140426" flood-opacity=".82"/></filter>
  <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<g transform="translate(24 16)" filter="url(#shadow)">
  <rect x="82" y="14" width="164" height="228" rx="36" fill="#4c1d95" stroke="#9333ea" stroke-width="8" transform="rotate(7 164 128)"/>
  <rect x="61" y="19" width="164" height="228" rx="36" fill="#6d28d9" stroke="#c084fc" stroke-width="8" transform="rotate(3 143 133)"/>
  <rect x="42" y="14" width="164" height="234" rx="36" fill="url(#bg)" stroke="url(#edge)" stroke-width="10"/>
  <rect x="50" y="23" width="148" height="216" rx="28" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="3"/>
  <rect x="6" y="59" width="54" height="23" rx="12" fill="url(#edge)" stroke="#5b21b6" stroke-width="4"/>
  <rect x="6" y="171" width="54" height="23" rx="12" fill="url(#edge)" stroke="#5b21b6" stroke-width="4"/>
  <path d="M87 74h29v52l52-52h39l-61 59 63 69h-42l-44-49-7 7v42H87z" fill="url(#white)"/>
  <path d="M165 50l8 16 16 8-16 8-8 16-8-16-16-8 16-8z" fill="#fff" filter="url(#softGlow)">
    <animate attributeName="opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/>
  </path>
</g>

<g filter="url(#shadow)">
  <text x="315" y="183" font-family="Arial Black, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="-4" fill="url(#white)" stroke="#2a1747" stroke-width="7" paint-order="stroke">Kasey's</text>
  <text x="805" y="183" font-family="Arial Black, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="-5" fill="url(#txt)" stroke="#2a1747" stroke-width="7" paint-order="stroke">Binder Studio</text>
</g>

<g fill="#fff" filter="url(#softGlow)">
  <path d="M300 62l7 14 14 7-14 7-7 14-7-14-14-7 14-7z">
    <animate attributeName="opacity" values=".15;1;.15" dur="2.8s" repeatCount="indefinite" begin=".2s"/>
  </path>
  <path d="M785 72l6 12 12 6-12 6-6 12-6-12-12-6 12-6z">
    <animate attributeName="opacity" values=".12;1;.12" dur="3.2s" repeatCount="indefinite" begin="1.1s"/>
  </path>
  <path d="M1230 58l7 14 14 7-14 7-7 14-7-14-14-7 14-7z">
    <animate attributeName="opacity" values=".18;1;.18" dur="2.6s" repeatCount="indefinite" begin=".7s"/>
  </path>
  <path d="M1675 86l6 12 12 6-12 6-6 12-6-12-12-6 12-6z">
    <animate attributeName="opacity" values=".15;1;.15" dur="3s" repeatCount="indefinite" begin="1.6s"/>
  </path>
</g>
</svg>